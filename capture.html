<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Capture</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0e0e0f; --surface: #161618; --surface2: #1e1e21;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.14);
  --text: #f0efe8; --muted: #888884; --dim: #4a4a48;
  --accent: #c8f06a; --accent-dim: rgba(200,240,106,0.12);
  --red: #ff5a5a; --red-dim: rgba(255,90,90,0.12);
  --blue: #5ab4ff; --blue-dim: rgba(90,180,255,0.1);
  --amber: #f5a623; --amber-dim: rgba(245,166,35,0.1);
  --teal: #3dd6b5; --teal-dim: rgba(61,214,181,0.1);
  --radius: 12px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 20px; }
.wrap { width: 100%; max-width: 540px; }
.header { margin-bottom: 28px; }
.header h1 { font-size: 24px; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 4px; }
.header p { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.card-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.6; resize: none; outline: none; min-height: 140px; transition: border-color 0.15s; }
textarea:focus { border-color: var(--border2); }
textarea::placeholder { color: var(--dim); }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn { border-radius: var(--radius-sm); padding: 11px 20px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; border: none; transition: all 0.15s; display: flex; align-items: center; gap: 7px; }
.btn-primary { background: var(--accent); color: #000; flex: 1; justify-content: center; }
.btn-primary:hover { background: #d6ff70; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--border2); color: var(--text); }
.status { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 18px; text-align: center; }
.status.error { color: var(--red); }
.status.success { color: var(--accent); }

/* Converted tasks preview */
.task-preview { display: flex; flex-direction: column; gap: 8px; }
.task-preview-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--surface2); border-radius: var(--radius-sm); border: 1px solid var(--border); }
.task-preview-text { flex: 1; font-size: 13px; }
.task-tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
.tag-gym { background: var(--blue-dim); color: var(--blue); }
.tag-business { background: var(--teal-dim); color: var(--teal); }
.tag-personal { background: var(--amber-dim); color: var(--amber); }
.tag-urgent { background: var(--red-dim); color: var(--red); }
.task-remove { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1; }
.task-remove:hover { color: var(--red); }
.task-tag-select { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 10px; font-weight: 600; padding: 2px 7px; outline: none; cursor: pointer; }

.dash-link { text-align: center; margin-top: 24px; }
.dash-link a { font-size: 12px; color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.dash-link a:hover { color: var(--text); }

.thinking-dots::after { content: ''; animation: dots 1.2s infinite; }
@keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Brain Dump</h1>
    <p>Type or dictate anything — Claude converts it to tasks.</p>
  </div>

  <div class="card">
    <div class="card-label">What's on your mind?</div>
    <textarea id="dump-input" placeholder="e.g. need to call the landlord about the lease, book flights for August comp, film a reel on snatch technique, check in with Sarah about memberships, get dog food..."></textarea>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
      <button class="btn btn-primary" id="convert-btn" onclick="convertDump()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Convert to Tasks
      </button>
    </div>
    <div class="status" id="convert-status"></div>
  </div>

  <div class="card" id="preview-card" style="display:none;">
    <div class="card-label" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Converted Tasks</span>
      <span id="task-count" style="color:var(--accent);"></span>
    </div>
    <div class="task-preview" id="task-preview"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-secondary" onclick="cancelPreview()">Back</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveTasks()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Save to Dashboard
      </button>
    </div>
    <div class="status" id="save-status"></div>
  </div>

  <div class="dash-link">
    <a href="https://ant839.github.io/dashboard/dashboard.html">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Go to Dashboard
    </a>
  </div>
</div>

<script>
const GITHUB_TOKEN = '';
const GITHUB_REPO = 'ant839/dashboard';
const TASKS_FILE = 'tasks.json';

let convertedTasks = [];

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function setStatus(id, msg, type='') {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status' + (type ? ' '+type : '');
}

function clearAll() {
  document.getElementById('dump-input').value = '';
  document.getElementById('preview-card').style.display = 'none';
  document.getElementById('convert-status').textContent = '';
  convertedTasks = [];
}

function cancelPreview() {
  document.getElementById('preview-card').style.display = 'none';
  document.getElementById('convert-status').textContent = '';
}

async function convertDump() {
  const text = document.getElementById('dump-input').value.trim();
  if (!text) return;
  const btn = document.getElementById('convert-btn');
  btn.disabled = true;
  setStatus('convert-status', 'Converting');
  document.querySelector('#convert-status').classList.add('thinking-dots');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `You are a task extraction assistant for Ant Usmar. He owns Rev Barbell Club (Olympic weightlifting gym) in Perth WA, trains BJJ competing August 2026, runs @antstrengthcoach on Instagram, and is building a startup called IntelliFight.

Extract every actionable task from the input. Return ONLY valid JSON — an array of objects, no markdown, no explanation.
Each object: { "text": "concise action verb task", "tag": "gym|business|personal|urgent" }

Tag rules:
- gym: anything training, coaching, gym ops, athletes, programming, Rev Barbell
- business: admin, marketing, content, money, emails, Instagram, IntelliFight
- urgent: deadlines, time-sensitive, overdue
- personal: everything else (errands, family, home, health, dog, car)

Keep task text short and action-oriented. Start with a verb.`,
        messages: [{ role: 'user', content: text }]
      })
    });
    const data = await res.json();
    const raw = data.content?.[0]?.text || '[]';
    const cleaned = raw.replace(/```json|```/g, '').trim();
    convertedTasks = JSON.parse(cleaned);
    document.querySelector('#convert-status').classList.remove('thinking-dots');
    setStatus('convert-status', '');
    renderPreview();
  } catch(e) {
    document.querySelector('#convert-status').classList.remove('thinking-dots');
    setStatus('convert-status', 'Error converting — try again.', 'error');
    console.error(e);
  }
  btn.disabled = false;
}

function renderPreview() {
  const card = document.getElementById('preview-card');
  const preview = document.getElementById('task-preview');
  document.getElementById('task-count').textContent = convertedTasks.length + ' tasks';

  preview.innerHTML = convertedTasks.map((t, i) => `
    <div class="task-preview-item" id="task-item-${i}">
      <span class="task-preview-text">${escHtml(t.text)}</span>
      <select class="task-tag-select tag-${t.tag}" onchange="changeTag(${i}, this.value)">
        <option value="personal" ${t.tag==='personal'?'selected':''}>personal</option>
        <option value="gym" ${t.tag==='gym'?'selected':''}>gym</option>
        <option value="business" ${t.tag==='business'?'selected':''}>business</option>
        <option value="urgent" ${t.tag==='urgent'?'selected':''}>urgent</option>
      </select>
      <button class="task-remove" onclick="removeTask(${i})">×</button>
    </div>
  `).join('');

  card.style.display = 'block';
  card.scrollIntoView({ behavior: 'smooth' });
}

function changeTag(i, val) {
  convertedTasks[i].tag = val;
  const sel = document.querySelector(`#task-item-${i} select`);
  sel.className = 'task-tag-select tag-' + val;
}

function removeTask(i) {
  convertedTasks.splice(i, 1);
  if (!convertedTasks.length) { cancelPreview(); return; }
  renderPreview();
}

// GitHub read/write
async function getFileSha() {
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${TASKS_FILE}`, {
      headers: { Authorization: 'Bearer ' + GITHUB_TOKEN, Accept: 'application/vnd.github+json' }
    });
    if (res.status === 404) return { sha: null, tasks: [] };
    const data = await res.json();
    const content = JSON.parse(atob(data.content.replace(/\n/g, '')));
    return { sha: data.sha, tasks: content };
  } catch(e) { return { sha: null, tasks: [] }; }
}

async function saveTasks() {
  if (!convertedTasks.length) return;
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('save-status', 'Saving to dashboard...');

  try {
    const { sha, tasks } = await getFileSha();
    const newTasks = [
      ...tasks,
      ...convertedTasks.map(t => ({ ...t, done: false, id: Date.now() + Math.random() }))
    ];
    const content = btoa(JSON.stringify(newTasks, null, 2));
    const body = { message: 'Add tasks from brain dump', content, ...(sha ? { sha } : {}) };

    const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${TASKS_FILE}`, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + GITHUB_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      setStatus('save-status', `${convertedTasks.length} tasks saved to your dashboard!`, 'success');
      convertedTasks = [];
      document.getElementById('dump-input').value = '';
      setTimeout(() => { document.getElementById('preview-card').style.display = 'none'; setStatus('save-status',''); }, 2500);
    } else {
      setStatus('save-status', 'Save failed — check your connection.', 'error');
    }
  } catch(e) {
    setStatus('save-status', 'Save failed — try again.', 'error');
    console.error(e);
  }
  btn.disabled = false;
}
</script>
</body>
</html>
