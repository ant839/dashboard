<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e0f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="Rev">
<title>Home · Rev</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0e0e0f; --surface: #161618; --surface2: #1e1e21;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.14);
  --text: #f0efe8; --muted: #888884; --dim: #4a4a48;
  --accent: #c8f06a; --accent-dim: rgba(200,240,106,0.12);
  --red: #ff5a5a; --red-dim: rgba(255,90,90,0.12);
  --blue: #5ab4ff; --blue-dim: rgba(90,180,255,0.1);
  --amber: #f5a623; --amber-dim: rgba(245,166,35,0.1);
  --teal: #3dd6b5; --teal-dim: rgba(61,214,181,0.1);
  --purple: #b08fff; --radius: 10px; --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; min-height: 100vh; padding: calc(22px + env(safe-area-inset-top, 0px)) 26px calc(40px + env(safe-area-inset-bottom, 0px)); }
::selection { background: var(--accent); color: #000; }
input, select, textarea, button { font-family: inherit; font-size: 13px; }
input, select, textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 7px 11px; outline: none; transition: border-color 0.15s; }
input:focus, select:focus, textarea:focus { border-color: var(--border2); }
input::placeholder, textarea::placeholder { color: var(--dim); }
select option { background: var(--surface2); }

/* Header */
.header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.header-left .greeting { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 3px; }
.header-left .day { font-size: 28px; font-weight: 300; letter-spacing: -0.02em; }
.header-left .date-str { font-size: 13px; color: var(--muted); margin-top: 2px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.clock { font-family: 'DM Mono', monospace; font-size: 26px; font-weight: 400; letter-spacing: -0.02em; }
.gcal-btn { display: flex; align-items: center; gap: 7px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 13px; color: var(--muted); cursor: pointer; font-size: 12px; transition: all 0.15s; }
.gcal-btn:hover { border-color: var(--border2); color: var(--text); }
.gc-modal { position: fixed; inset: 0; z-index: 120; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; }
.gc-card { width: min(420px,100%); background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 20px; display: grid; gap: 12px; }
.gc-card h3 { font-size: 18px; font-weight: 400; }
.gc-card p { font-size: 13px; color: var(--muted); line-height: 1.55; }
.gc-card b { color: var(--text); font-weight: 500; }
.gc-card input { width: 100%; padding: 10px 12px; font-size: 14px; }
.gc-err { color: var(--red) !important; min-height: 0; }
.gc-card .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.gc-acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.gcal-btn.connected { color: var(--accent); border-color: rgba(200,240,106,0.3); }

/* Metrics */
.metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; }
.metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
.metric-val { font-size: 19px; font-weight: 500; }
.prog-track { height: 2px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }

/* Layout */
.main-layout { display: grid; grid-template-columns: 340px 1fr; grid-template-rows: auto auto; gap: 14px; }
.left-col { grid-row: 1 / 3; display: flex; flex-direction: column; gap: 14px; }
.right-top { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1300px) { .right-top { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
.right-top > .card { padding: 14px 14px; }
.right-top .sched-add { flex-wrap: wrap; }
.right-top .sched-add input[type="text"] { flex: 1 1 100%; min-width: 0; order: -1; }
.right-top .sched-add input[type="time"] { flex: 1 1 auto; width: auto; min-width: 0; }
.right-top > .card { height: 400px; display: flex; flex-direction: column; min-width: 0; }
.right-top .sched-list, .right-top .rt-body { flex: 1; max-height: none; min-height: 0; }
.right-top .chat-card { min-height: 0; }
.right-top .chat-messages { flex: 1; max-height: none; min-height: 0; }
.right-bottom {}

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.card-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.card-label-left { display: flex; align-items: center; gap: 7px; }
.card-sublabel { font-size: 11px; color: var(--dim); font-weight: 400; letter-spacing: 0; text-transform: none; }

/* Tasks */
.task-input-row { display: flex; gap: 7px; margin-bottom: 10px; }
.task-input-row input { flex: 1; min-width: 0; }
.task-input-row select { flex-shrink: 0; }
.task-input-row .btn { flex-shrink: 0; }
.task-input-row select { width: 100px; }
.filter-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.pill { font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); background: none; cursor: pointer; transition: all 0.15s; }
.pill:hover { border-color: var(--border2); color: var(--text); }
.pill.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }
.task-list { max-height: 420px; overflow-y: auto; }
.task-list::-webkit-scrollbar { width: 3px; }
.task-list::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
.task-item { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.task-item:last-child { border-bottom: none; }
.task-check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--dim); cursor: pointer; flex-shrink: 0; transition: all 0.15s; position: relative; }
.task-check:hover { border-color: var(--accent); }
.task-check.done { background: var(--accent); border-color: var(--accent); }
.task-check.done::after { content: ''; position: absolute; top: 1px; left: 3px; width: 5px; height: 8px; border: 2px solid #000; border-top: none; border-left: none; transform: rotate(45deg); }
.task-text { flex: 1; font-size: 13px; line-height: 1.4; }
.task-text.done { text-decoration: line-through; color: var(--dim); }
.task-tag { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 20px; letter-spacing: 0.05em; flex-shrink: 0; }
.tag-gym { background: var(--blue-dim); color: var(--blue); }
.tag-business { background: var(--teal-dim); color: var(--teal); }
.tag-personal { background: var(--amber-dim); color: var(--amber); }
.tag-urgent { background: var(--red-dim); color: var(--red); }
.task-del { background: none; border: none; color: var(--dim); cursor: pointer; padding: 2px 3px; font-size: 14px; opacity: 0; transition: opacity 0.15s; }
.task-item:hover .task-del { opacity: 1; }
.task-del:hover { color: var(--red); }
.task-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.task-meta { display: flex; gap: 8px; font-size: 10.5px; color: var(--muted); align-items: center; }
.task-meta .over { color: var(--red); font-weight: 600; }
.task-meta .soon { color: var(--accent); }
.task-note { font-size: 11px; color: var(--muted); line-height: 1.35; }
.task-voice { width: 10px; height: 10px; flex-shrink: 0; color: var(--muted); }
.task-done-hdr { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; padding: 10px 0 4px; border-bottom: 1px solid var(--border); }
.task-sync { font-size: 10px; color: var(--dim); text-align: center; padding: 6px 0 0; }
.empty { font-size: 12px; color: var(--dim); padding: 12px 0; text-align: center; }

/* Schedule lists */
.sched-list { max-height: 240px; overflow-y: auto; margin-bottom: 10px; }
.sched-list::-webkit-scrollbar { width: 3px; }
.sched-list::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
.sched-item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--border); }
.sched-item:last-child { border-bottom: none; }
.sched-time { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); min-width: 38px; padding-top: 2px; flex-shrink: 0; }
.sched-bar { width: 2px; border-radius: 2px; min-height: 26px; flex-shrink: 0; }
.sched-content { flex: 1; min-width: 0; }
.sched-title { font-size: 12px; color: var(--text); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sched-loc { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sched-now-badge { display: inline-block; background: var(--accent-dim); border-radius: 4px; padding: 1px 5px; font-size: 10px; font-weight: 600; color: var(--accent); margin-left: 4px; vertical-align: middle; }
.sched-del { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; opacity: 0; transition: opacity 0.15s; padding: 2px 2px; flex-shrink: 0; }
.sched-item:hover .sched-del { opacity: 1; }
.sched-del:hover { color: var(--red); }
.sched-add { display: flex; gap: 6px; }
.sched-add input[type="time"] { width: 95px; }
.sched-add input[type="text"] { flex: 1; }

/* Focus banner */
.focus-banner { display: flex; align-items: center; gap: 8px; background: var(--accent-dim); border: 1px solid rgba(200,240,106,0.2); border-radius: var(--radius-sm); padding: 6px 11px; margin-bottom: 10px; }
.focus-banner-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
.focus-banner-word { font-size: 13px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; }

/* Chat */
.chat-card { display: flex; flex-direction: column; min-height: 320px; }
.chat-clear-btn { font-size: 10px; color: var(--dim); background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 0.15s; }
.chat-clear-btn:hover { color: var(--red); }
.chat-messages { flex: 1; max-height: 260px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
.chat-bubble { padding: 8px 11px; border-radius: 8px; font-size: 12px; line-height: 1.55; word-break: break-word; }
.chat-bubble.user { background: var(--surface2); color: var(--text); border: 1px solid var(--border); align-self: flex-end; border-radius: 8px 8px 2px 8px; max-width: 90%; }
.chat-bubble.assistant { background: var(--accent-dim); color: var(--text); border: 1px solid rgba(200,240,106,0.15); align-self: flex-start; border-radius: 8px 8px 8px 2px; max-width: 100%; }
.bubble-label { font-size: 9px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
.chat-bubble.thinking { opacity: 0.5; font-style: italic; color: var(--muted); align-self: flex-start; }
.chat-input-row { display: flex; gap: 7px; align-items: flex-end; }
.chat-input { flex: 1; resize: none; font-size: 12px; line-height: 1.5; min-height: 38px; max-height: 90px; overflow-y: auto; }
.chat-send-btn { background: var(--accent); border: none; border-radius: var(--radius-sm); padding: 9px 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; height: 38px; }
.chat-send-btn:hover { background: #d6ff70; }
.chat-send-btn svg { stroke: #000; }
.chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.chat-empty { font-size: 12px; color: var(--dim); text-align: center; padding: 20px 0; line-height: 1.6; }

/* Week calendar */
.week-cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.week-cal-top-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.week-cal-header-row { display: grid; grid-template-columns: 40px repeat(7, 1fr); border: 1px solid var(--border); border-radius: 6px 6px 0 0; overflow: hidden; border-bottom: none; }
.wcal-corner { background: var(--surface2); border-right: 1px solid var(--border); padding: 6px 0; }
.wcal-day-head { background: var(--surface2); border-right: 1px solid var(--border); padding: 6px 4px; text-align: center; }
.wcal-day-head:last-child { border-right: none; }
.wcal-dh-name { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.wcal-dh-num { font-size: 14px; font-weight: 500; margin-top: 1px; }
.wcal-day-head.today .wcal-dh-name { color: var(--accent); }
.wcal-day-head.today .wcal-dh-num { color: var(--accent); }

/* Focus row */
.wcal-focus-row { display: grid; grid-template-columns: 40px repeat(7, 1fr); border: 1px solid var(--border); border-top: none; border-bottom: none; background: rgba(200,240,106,0.04); }
.wcal-focus-corner { border-right: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; padding: 0 5px; }
.wcal-focus-corner-label { font-size: 8px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
.wcal-focus-cell { border-right: 1px solid var(--border); padding: 3px 4px; }
.wcal-focus-cell:last-child { border-right: none; }
.wcal-focus-input { width: 100%; background: none; border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); text-align: center; padding: 2px 0; cursor: text; }
.wcal-focus-input::placeholder { color: var(--dim); font-weight: 400; letter-spacing: 0.03em; text-transform: none; font-size: 10px; }

.wcal-allday-row { display: grid; grid-template-columns: 40px repeat(7, 1fr); border: 1px solid var(--border); border-top: none; border-bottom: none; }
.wcal-allday-label { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 4px; border-right: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; }
.wcal-allday-cell { border-right: 1px solid var(--border); min-height: 18px; padding: 2px; }
.wcal-allday-cell:last-child { border-right: none; }
.wcal-allday-cell.today-col { background: rgba(200,240,106,0.025); }
.wcal-allday-event { font-size: 10px; border-radius: 3px; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }

.week-cal-scroll { overflow-y: auto; max-height: 340px; border: 1px solid var(--border); border-radius: 0 0 6px 6px; }
.week-cal-scroll::-webkit-scrollbar { width: 3px; }
.week-cal-scroll::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
.week-cal-body { display: grid; grid-template-columns: 40px repeat(7, 1fr); }
.wcal-time-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--dim); text-align: right; padding: 3px 5px 0; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); height: 40px; display: flex; align-items: flex-start; justify-content: flex-end; }
.wcal-cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); height: 40px; position: relative; }
.wcal-cell:last-child { border-right: none; }
.wcal-cell.today-col { background: rgba(200,240,106,0.025); }
.wcal-event { position: absolute; left: 2px; right: 2px; border-radius: 3px; padding: 2px 4px; font-size: 10px; line-height: 1.25; overflow: hidden; z-index: 1; min-height: 14px; }
.wcal-event-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wcal-event-time { opacity: 0.7; font-family: 'DM Mono', monospace; font-size: 9px; }
.now-line { position: absolute; left: 0; right: 0; height: 1px; background: var(--accent); z-index: 10; pointer-events: none; }
.now-line::before { content: ''; position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.btn { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s; }
.btn:hover { border-color: var(--border2); background: rgba(255,255,255,0.04); }
.btn-icon { padding: 7px 9px; font-size: 15px; }


/* Projects */
.proj-card { padding-bottom: 12px; }
.proj-hdr-actions { display: flex; align-items: center; gap: 8px; }
.proj-add, .proj-toggle { background: none; border: none; cursor: pointer; font-size: 10px; font-weight: 500; letter-spacing: 0.05em; padding: 0; }
.proj-add { color: var(--accent); }
.proj-toggle { color: var(--muted); }
.proj-toggle:hover { color: var(--text); }
.proj-strip { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 460px; min-height: 80px; padding-right: 4px; margin-right: -4px; }
.proj-strip::-webkit-scrollbar { width: 3px; }
.proj { display: flex; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--pc); border-radius: var(--radius-sm); padding: 10px 12px 10px 6px; color: var(--text); cursor: pointer; transition: border-color 0.15s; flex-shrink: 0; }
.proj:hover { border-color: var(--border2); border-left-color: var(--pc); }
.proj:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.proj.is-done { opacity: 0.55; }
.proj-grip { flex-shrink: 0; width: 18px; display: flex; align-items: center; justify-content: center; cursor: grab; fill: var(--dim); touch-action: none; border-radius: 4px; }
.proj-grip:hover { fill: var(--muted); background: rgba(255,255,255,0.04); }
.proj-grip:active { cursor: grabbing; }
.proj-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.proj-ghost { opacity: 0.35; }
.proj-chosen { box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.proj-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.proj-status { font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
.st-planning { background: var(--blue-dim); color: var(--blue); }
.st-inprogress { background: var(--accent-dim); color: var(--accent); }
.st-onhold { background: var(--amber-dim); color: var(--amber); }
.st-done { background: rgba(255,255,255,0.06); color: var(--muted); }
.proj-due { font-size: 10px; color: var(--muted); white-space: nowrap; }
.proj-due.soon { color: var(--amber); }
.proj-due.late { color: var(--red); }
.proj-title { font-size: 13px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proj-notes { font-size: 11px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proj-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; }
.proj-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
.proj-bar div { height: 100%; background: var(--pc); border-radius: 4px; }
.proj-pct { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); min-width: 32px; text-align: right; }
.proj-empty { font-size: 12px; color: var(--dim); padding: 14px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.proj-signin { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--accent); padding: 4px 10px; cursor: pointer; font-size: 12px; }
.proj-err { font-size: 11px; color: var(--red); margin-bottom: 6px; }
.proj-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: grid; place-items: center; padding: 16px; }
.proj-box { width: min(420px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
.proj-mhead { display: flex; justify-content: space-between; align-items: center; }
.proj-mhead h3 { font-size: 18px; font-weight: 400; }
.proj-x { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
.pf { display: grid; gap: 6px; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; }
.pf > span { display: flex; justify-content: space-between; }
.pf b { color: var(--text); font-family: 'DM Mono', monospace; font-weight: 500; letter-spacing: 0; }
.pf input[type=text], .pf input:not([type]), .pf input[type=date], .pf textarea { font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 400; width: 100%; }
.pf textarea { resize: vertical; }
.pf input[type=range] { width: 100%; accent-color: var(--accent); padding: 0; background: none; border: none; }
.proj-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw input { position: absolute; opacity: 0; pointer-events: none; }
.sw span { display: block; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--border); }
.sw input:checked + span { border-color: var(--bg); box-shadow: 0 0 0 2px var(--text); }
.sw input:focus-visible + span { box-shadow: 0 0 0 2px var(--accent); }
.proj-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.proj-seg input { position: absolute; opacity: 0; pointer-events: none; }
.proj-seg span { display: block; text-align: center; padding: 7px 4px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); cursor: pointer; }
.proj-seg input:checked + span { background: var(--surface2); border-color: var(--border2); color: var(--text); }
.proj-seg input:focus-visible + span { border-color: var(--accent); }
.proj-quick { display: flex; gap: 5px; }
.proj-quick button { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; color: var(--muted); font-size: 11px; padding: 3px 0; cursor: pointer; }
.proj-quick button:hover { color: var(--text); border-color: var(--border2); }
.proj-mfoot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.proj-mfoot div { display: flex; gap: 8px; }
.proj-del { color: var(--red); }
.proj-save { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.proj-save:hover { background: #d6ff70; }

/* Weekly to-dos */
.rt-edit { background: none; border: none; cursor: pointer; font-size: 10px; font-weight: 500; letter-spacing: 0.05em; color: var(--muted); padding: 0; }
.rt-edit:hover { color: var(--text); }
.rt-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
.rt-day { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 0 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); }
.rt-day:hover { border-color: var(--border2); color: var(--text); }
.rt-day.today .rt-dl, .rt-day.today .rt-dn { color: var(--accent); }
.rt-day.on { background: var(--surface2); border-color: var(--border2); color: var(--text); }
.rt-dl { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; }
.rt-dn { font-size: 13px; font-weight: 500; }
.rt-dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; margin-top: 2px; }
.rt-day.some .rt-dot { background: var(--amber); }
.rt-day.all .rt-dot { background: var(--accent); }
.rt-prog-track { height: 2px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
.rt-prog-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }
.rt-body { max-height: 360px; overflow-y: auto; }
.rt-body::-webkit-scrollbar { width: 3px; }
.rt-sec { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; padding: 8px 0 4px; }
.rt-item { display: flex; align-items: center; gap: 9px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.rt-item.sub { padding-left: 25px; }
.rt-link { color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 6px; }
.rt-link:hover { color: var(--accent); }
.rt-link.done { color: var(--dim); }
.rt-arrow { margin-left: auto; color: var(--dim); font-size: 15px; line-height: 1; }
.rt-badge { font-size: 10px; font-weight: 600; color: var(--amber); background: var(--amber-dim, rgba(245,166,35,.14)); border-radius: 20px; padding: 1px 7px; text-decoration: none; }
.rt-item.sub .task-text { font-size: 12px; color: var(--muted); }
.rt-item.sub .task-text.done { color: var(--dim); }
.rt-item .task-check { background: none; padding: 0; }
.rt-item .task-check.done { background: var(--accent); }
.rt-del { margin-left: auto; background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; padding: 0 3px; white-space: nowrap; }
.rt-del:hover, .rt-del.armed { color: var(--red); font-size: 11px; }
.rt-empty { font-size: 12px; color: var(--dim); padding: 14px 0; text-align: center; }
.rt-add { display: flex; gap: 6px; margin-top: 10px; }
.rt-add input { flex: 1; min-width: 0; }
.rt-add select { width: 130px; }

/* Programs due */
.pd-open { font-size: 10px; color: var(--accent); text-decoration: none; font-weight: 500; letter-spacing: 0.05em; }
.pd-sub { font-size: 11px; color: var(--dim); margin: -6px 0 4px; }
.pd-item { display: flex; align-items: center; gap: 7px; padding: 6px 0; border-bottom: 1px solid var(--border); min-width: 0; }
.pd-name { flex: 1; min-width: 0; font-size: 13px; color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pd-name:hover { color: var(--accent); }
.pd-type { font-size: 9px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; max-width: 70px; overflow: hidden; text-overflow: ellipsis; }
.pd-ef { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); text-decoration: none; border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
.pd-ef:hover { border-color: var(--accent); }
.pd-days { font-family: 'DM Mono', monospace; font-size: 11px; min-width: 26px; text-align: center; padding: 2px 4px; border-radius: 4px; }
.pd-days.d-over { background: var(--red-dim); color: var(--red); }
.pd-days.d-soon { background: var(--amber-dim); color: var(--amber); }
.pd-days.d-ok { background: var(--accent-dim); color: var(--accent); }

/* Reorderable top row */
.right-top > [data-card] > .card-label { cursor: grab; user-select: none; -webkit-user-select: none; }
.right-top > [data-card] > .card-label:active { cursor: grabbing; }
.right-top > [data-card] > .card-label .card-label-left::before { content: ''; width: 8px; height: 12px; margin-right: -2px; opacity: 0; transition: opacity 0.15s;
  background: radial-gradient(circle, var(--muted) 1px, transparent 1.2px) 0 0 / 4px 4px; }
.right-top > [data-card]:hover > .card-label .card-label-left::before { opacity: 1; }
.card-ghost { opacity: 0.3; }
.card-chosen { box-shadow: 0 12px 32px rgba(0,0,0,0.55); }

/* PT today box */
.ptb-item { align-items: flex-start; }
.ptb-item .task-check { margin-top: 2px; }
.ptb-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.ptb-text .task-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptb-line { font-size: 11px; color: var(--muted); }
.ptb-line.warn { color: var(--amber); } .ptb-line.bad { color: var(--red); }
.ptb-attn { display: flex; flex-direction: column; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
.ptb-attn a { color: var(--text); text-decoration: none; font-size: 12px; }
.ptb-attn a:hover { color: var(--accent); }
.ptb-attn.warn span { color: var(--amber); } .ptb-attn.bad span { color: var(--red); }
.ptb-income { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 6px; display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; align-items: baseline; }
.ptb-inc-l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.ptb-inc-v { font-size: 17px; font-weight: 500; color: var(--teal); grid-row: span 2; align-self: center; }
.ptb-inc-s { font-size: 11px; color: var(--dim); }
.ptb-inc-bar { grid-column: 1 / -1; height: 2px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; margin-top: 5px; }
.ptb-inc-bar div { height: 100%; background: var(--teal); }
.ptb-pay { border-top: 1px solid var(--border2); margin-top: 6px; flex-shrink: 0; }
.ptb-pay:empty { display: none; }
.ptb-pay-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px; }
.ptb-pay-row a { flex: 1; min-width: 0; color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptb-pay-row a:hover { color: var(--accent); }
.ptb-pay-d { color: var(--muted); font-size: 11px; white-space: nowrap; }
.ptb-pay-a { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--teal); min-width: 52px; text-align: right; }
.ptb-skip { margin-left: auto; background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--dim); font-size: 10px; padding: 1px 6px; cursor: pointer; flex-shrink: 0; align-self: center; }
.ptb-skip:hover { color: var(--text); border-color: var(--border2); }
.ptb-skipped .ptb-text { opacity: 0.45; }
.ptb-pay-d.over { color: var(--red); }
.ptb-paid { color: var(--accent); border-color: var(--accent); margin-left: 6px; }
.ptb-grip { flex-shrink: 0; width: 16px; margin: 0 -4px 0 -6px; display: flex; align-items: center; justify-content: center; cursor: grab; fill: var(--dim); touch-action: none; align-self: center; height: 26px; }
.ptb-item.pt-ghost { opacity: .35; }
.ptb-btns { margin-left: auto; display: flex; gap: 4px; align-self: center; flex-shrink: 0; }
.ptb-btns .ptb-skip { margin-left: 0; }
.ptb-skipped .task-check { border-style: dashed; }
.ptb-more { display: block; font-size: 11px; color: var(--muted); padding-top: 6px; text-decoration: none; }

/* Phone and small tablet layout */
@media (max-width: 900px) {
  body { padding-left: 16px; padding-right: 16px; }
  .header { flex-wrap: wrap; gap: 12px; }
  .header-right { width: 100%; justify-content: space-between; }
  .clock { font-size: 22px; }
  .metrics-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .main-layout { grid-template-columns: minmax(0, 1fr); }
  .left-col { grid-row: auto; order: 2; }
  .right-top { order: 1; grid-template-columns: minmax(0, 1fr) !important; }
  .right-bottom { order: 3; min-width: 0; }
  .right-top > .card { height: auto; max-height: 460px; }
  .right-top .rt-body, .right-top .sched-list { max-height: 320px; }
  .week-cal-wrap { overflow-x: auto; }
  .week-cal-header-row, .wcal-focus-row, .wcal-allday-row, .week-cal-scroll { min-width: 620px; }
}
@media (min-width: 560px) and (max-width: 900px) {
  .right-top { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}

.lf { flex: 1 1 auto; max-width: 520px; height: 96px; margin: 0 24px; align-self: center; position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--border2); background: #0b1026; padding: 0; cursor: pointer; text-align: left; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.lf:hover { border-color: rgba(255,255,255,.28); }
.lf svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lf .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,8,20,.0) 0%, rgba(5,8,20,.0) 38%, rgba(5,8,20,.55) 70%, rgba(5,8,20,.7) 100%); }
.lf .txt { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); text-align: right; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.lf .k { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.7); }
.lf .t { font-size: 15px; font-weight: 500; margin-top: 2px; }
.lf .cd { font-family: 'DM Mono', monospace; font-size: 22px; letter-spacing: -.02em; margin-top: 2px; line-height: 1.1; }
.lf .cd small { font-family: 'DM Sans', sans-serif; font-size: 11px; color: rgba(255,255,255,.75); letter-spacing: 0; margin-left: 2px; }
.lf .d { font-size: 10px; color: rgba(255,255,255,.65); margin-top: 2px; }
.lf .dots { position: absolute; left: 12px; bottom: 9px; display: flex; gap: 4px; }
.lf .dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.35); }
.lf .dots i.on { background: #fff; }
@keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
@keyframes flick { 0%,100% { transform: scaleY(1) skewX(0) } 25% { transform: scaleY(1.12) skewX(-3deg) } 50% { transform: scaleY(.92) skewX(2deg) } 75% { transform: scaleY(1.06) skewX(-1deg) } }
@keyframes glow { 0%,100% { opacity: .55 } 50% { opacity: .85 } }
@keyframes drift { from { transform: translateX(0) } to { transform: translateX(-40px) } }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2px) } }
.lf .tw { animation: twinkle 3s ease-in-out infinite; }
.lf .fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .9s ease-in-out infinite; }
.lf .gl { animation: glow 1.6s ease-in-out infinite; }
.lf .dr { animation: drift 30s linear infinite alternate; }
.lf .bb { animation: bob 3s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .lf .tw, .lf .fl, .lf .gl, .lf .dr, .lf .bb { animation: none; } }
.lf-row { display: grid; grid-template-columns: 1fr 140px 110px auto; gap: 6px; align-items: center; }
.lf-row input, .lf-row select { width: 100%; padding: 7px 9px; font-size: 13px; min-width: 0; }
.lf-row .rm { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 4px 6px; cursor: pointer; }
.lf-row .rm:hover { color: var(--red); }
@media (max-width: 900px) { .lf { order: 3; flex-basis: 100%; max-width: none; margin: 4px 0 0; height: 92px; } .lf-row { grid-template-columns: 1fr 1fr; } }
.dream { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.dream b { color: var(--accent); font-weight: 600; }
.dream .bar { display: block; width: 220px; max-width: 100%; height: 3px; background: rgba(255,255,255,0.07); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.dream .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.quote { position: relative; margin: 0 0 18px; padding: 18px 56px 16px 58px; border-radius: 12px; background: linear-gradient(100deg, rgba(200,240,106,0.07), rgba(255,255,255,0.015) 55%); border: 1px solid var(--border); overflow: hidden; }
.quote::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(var(--accent), rgba(200,240,106,0.15)); }
.q-mark { position: absolute; left: 18px; top: 6px; font-family: 'DM Sans', sans-serif; font-weight: 300; font-size: 56px; line-height: 1; color: var(--accent); opacity: 0.55; }
.quote blockquote { margin: 0; font-size: 18px; font-weight: 300; line-height: 1.45; color: var(--text); letter-spacing: -0.005em; }
.quote figcaption { margin-top: 6px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.cmdr { position: relative; display: grid; grid-template-columns: 168px 1fr; gap: 18px; align-items: center; margin: 0 0 18px; padding: 12px 52px 12px 12px; border-radius: 14px; border: 1px solid var(--border); background: linear-gradient(100deg, rgba(200,240,106,0.05), rgba(255,255,255,0.012) 60%); overflow: hidden; }
.cmdr-fig { width: 168px; height: 112px; flex-shrink: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--border2); padding: 0; background: #0b1026; cursor: pointer; display: block; }
.cmdr-fig svg { width: 100%; height: 100%; display: block; }
.cmdr-bubble { position: relative; background: var(--surface2); border: 1px solid var(--border2); border-radius: 14px; padding: 14px 18px 12px; cursor: pointer; min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
.cmdr-bubble::before { content: ''; position: absolute; left: -9px; top: 50%; width: 16px; height: 16px; background: var(--surface2); border-left: 1px solid var(--border2); border-bottom: 1px solid var(--border2); transform: translateY(-50%) rotate(45deg); }
.cmdr-bubble:hover { border-color: rgba(200,240,106,0.35); }
.cmdr-bubble p { font-size: 18px; font-weight: 400; line-height: 1.4; color: var(--text); letter-spacing: -0.005em; transition: opacity .25s, transform .25s; }
.cmdr-bubble p.swap { opacity: 0; transform: translateY(4px); }
.cmdr-by { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.cmdr-by #cmdrBy.real { color: var(--accent); }
.cmdr-hint { color: var(--dim); }
@keyframes breathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1px) } }
@keyframes steam { 0% { opacity: 0; transform: translateY(2px) } 40% { opacity: .5 } 100% { opacity: 0; transform: translateY(-8px) } }
.cmdr .br { animation: breathe 4s ease-in-out infinite; }
.cmdr .st { animation: steam 3s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .cmdr .br, .cmdr .st { animation: none; } }
@media (max-width: 900px) { .cmdr { grid-template-columns: 96px 1fr; gap: 14px; padding: 10px 36px 10px 10px; } .cmdr-fig { width: 96px; height: 96px; } .cmdr-bubble p { font-size: 15px; } .cmdr-hint { display: none; } }
.q-secret { position: absolute; right: 12px; bottom: 10px; color: var(--muted); opacity: 0.22; transition: opacity .2s, color .2s, transform .3s; padding: 6px; display: flex; }
.q-secret:hover, .q-secret:focus-visible { opacity: 0.9; color: var(--accent); transform: rotate(45deg); }
@media (max-width: 900px) { .quote { padding: 16px 40px 14px 44px; } .q-mark { left: 12px; font-size: 46px; } .quote blockquote { font-size: 16px; } }
@media (prefers-reduced-motion: no-preference) { .quote blockquote { animation: qfade .8s ease-out both; } @keyframes qfade { from { opacity: 0; transform: translateY(4px); } } }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
</style>

<body>

<div class="header">
  <div class="header-left">
    <div class="greeting" id="greeting">Good morning, Ant</div>
    <div class="dream" id="dream"></div>
    <div class="day" id="day-name">Monday</div>
    <div class="date-str" id="date-str"></div>
  </div>
  <button type="button" class="lf" id="lf" aria-label="Something to look forward to. Tap to edit."></button>
  <div class="header-right">
    <div class="clock" id="clock">--:--</div>
    <button class="gcal-btn" id="gcal-btn" onclick="handleGcalAuth()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="gcal-label">Connect Google Calendar</span>
    </button>
  </div>
</div>

<section class="cmdr" id="cmdr" aria-label="The Commander">
  <button type="button" class="cmdr-fig" id="cmdrFig" aria-label="Another one"></button>
  <div class="cmdr-bubble" id="cmdrBubble" role="button" tabindex="0" aria-label="Tap for another">
    <p id="cmdrText"></p>
    <div class="cmdr-by"><span id="cmdrBy"></span><span class="cmdr-hint">tap for another</span></div>
  </div>
  <a class="q-secret" href="discipline.html" aria-label="Open">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>
  </a>
</section>

<div class="metrics-row" id="metrics"></div>
<div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>

<div class="main-layout">

  <!-- Left col: Tasks -->
  <div class="left-col">
    <div class="card proj-card">
      <div class="card-label">
        <div class="card-label-left">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Projects <span class="card-sublabel" id="proj-count"></span>
        </div>
        <div class="proj-hdr-actions">
          <button class="proj-toggle" id="proj-show-done" type="button" hidden>Show done</button>
          <button class="proj-add" id="proj-add" type="button" hidden>+ Add</button>
        </div>
      </div>
      <div class="proj-strip" id="proj-strip"></div>
    </div>
    <div class="card" style="flex:1;">
      <div class="card-label">
        <div class="card-label-left">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Tasks
        </div>
      </div>

<script>
const KEY = 'ant_dash_v8';
const TOKEN_KEY = 'ant_gcal_token';
const CHAT_KEY = 'ant_chat_v1';
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const HOUR_START = 6, HOUR_END = 22, CELL_H = 40;

const EV_PALETTES = [
  { bg: 'rgba(90,180,255,0.18)', text: '#5ab4ff' },
  { bg: 'rgba(61,214,181,0.18)', text: '#3dd6b5' },
  { bg: 'rgba(176,143,255,0.18)', text: '#b08fff' },
  { bg: 'rgba(245,166,35,0.18)', text: '#f5a623' },
  { bg: 'rgba(200,240,106,0.18)', text: '#c8f06a' },
  { bg: 'rgba(255,90,90,0.18)', text: '#ff5a5a' },
];

let state = { tasks: [], schedule: [], focusWords: {} };
let calEvents = [];
let tasks = [];        // rows from the Supabase tasks table
let tasksReady = false; // false until the first load after sign-in
let chatHistory = [];
let taskFilter = 'all';
let calConnected = false;
const CAL_CACHE = 'ant_gcal_events_v2';

// ---- Persist ----
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }
function load() { try { const r = localStorage.getItem(KEY); if (r) state = JSON.parse(r); if (!state.focusWords) state.focusWords = {}; } catch(e) {} }
function saveToken(token, exp) { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token, expiry: Date.now() + (exp - 60) * 1000 })); }
function loadToken() {
  try { const r = localStorage.getItem(TOKEN_KEY); if (!r) return null; const { token, expiry } = JSON.parse(r); if (Date.now() < expiry) return token; localStorage.removeItem(TOKEN_KEY); } catch(e) {} return null;
}
function clearToken() { localStorage.removeItem(TOKEN_KEY); }
function saveChat() { try { localStorage.setItem(CHAT_KEY, JSON.stringify(chatHistory)); } catch(e) {} }
function loadChat() { try { const r = localStorage.getItem(CHAT_KEY); if (r) chatHistory = JSON.parse(r); } catch(e) {} }

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hashStr(s) { let h=0; for(let i=0;i<s.length;i++) h=(Math.imul(31,h)+s.charCodeAt(i))|0; return Math.abs(h); }
function dateKey(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ---- Clock ----
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const hr = now.getHours();
  document.getElementById('greeting').textContent = hr<12?'Good morning, Ant':hr<17?'Good afternoon, Ant':'Good evening, Ant';
}
setInterval(tick, 1000); tick();

function setDateHeader() {
  const now = new Date();
  document.getElementById('day-name').textContent = DAYS[now.getDay()];
  document.getElementById('date-str').textContent = now.getDate()+' '+MONTHS[now.getMonth()]+' '+now.getFullYear();
  document.getElementById('today-date-label').textContent = DAY_SHORT[now.getDay()]+' '+now.getDate()+' '+MON_SHORT[now.getMonth()];
  const tom = new Date(now); tom.setDate(now.getDate()+1);
  document.getElementById('tomorrow-date-label').textContent = DAY_SHORT[tom.getDay()]+' '+tom.getDate()+' '+MON_SHORT[tom.getMonth()];
}
setDateHeader();

// ---- Calendar helpers ----
function getWeekDays() {
  const now = new Date(), dow = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate()-((dow+6)%7)); mon.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function getWeekBounds() {
  const days = getWeekDays(); const sun = new Date(days[6]); sun.setHours(23,59,59,999);
  return { mon: days[0], sun };
}
function isSameDay(a,b) { return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function parseEventStart(ev) {
  if (ev.start.dateTime) return new Date(ev.start.dateTime);
  if (ev.start.date) return new Date(ev.start.date+'T00:00:00');
  return null;
}
function parseEventEnd(ev) {
  if (ev.end.dateTime) return new Date(ev.end.dateTime);
  if (ev.end.date) { const d=new Date(ev.end.date+'T00:00:00'); d.setDate(d.getDate()-1); return d; }
  return null;
}
function isAllDay(ev) { return !!ev.start.date && !ev.start.dateTime; }
function fmtEvTime(ev) {
  if (isAllDay(ev)) return 'all day';
  const d=parseEventStart(ev); if(!d) return '';
  const h=d.getHours(),m=d.getMinutes();
  return (h>12?h-12:h||12)+(m?':'+String(m).padStart(2,'0'):'')+(h>=12?'pm':'am');
}
function fmtManualTime(t) {
  const [h,m]=t.split(':'); const hr=parseInt(h);
  return (hr>12?hr-12:hr||12)+':'+m+(hr>=12?'pm':'am');
}
function getEventsForDay(d) {
  return calEvents.filter(ev=>!isAllDay(ev)&&(()=>{const s=parseEventStart(ev);return s&&isSameDay(s,d);})())
    .sort((a,b)=>parseEventStart(a)-parseEventStart(b));
}
function getAllDayForDay(d) {
  return calEvents.filter(ev=>isAllDay(ev)&&(()=>{const s=parseEventStart(ev);return s&&isSameDay(s,d);})());
}

// ---- Metrics ----
function renderMetrics() {
  const rt=window.revRoutineToday||{done:0,total:0};
  const tv=visibleTasks(tasks);
  const total=tv.length+rt.total, done=tv.filter(t=>t.done).length+rt.done;
  const pct=total?Math.round((done/total)*100):0;
  const today=new Date(), tom=new Date(today); tom.setDate(today.getDate()+1);
  const todayEvs=getEventsForDay(today).length+state.schedule.length;
  const tomEvs=getEventsForDay(tom).length;
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Tasks done</div><div class="metric-val" style="color:var(--accent)">${done}/${total}</div></div>
    <div class="metric"><div class="metric-label">Complete</div><div class="metric-val">${pct}%</div></div>
    <div class="metric"><div class="metric-label">Today's events</div><div class="metric-val" style="color:var(--blue)">${todayEvs}</div></div>
    <div class="metric"><div class="metric-label">Tomorrow</div><div class="metric-val" style="color:var(--purple)">${tomEvs} events</div></div>
  `;
  document.getElementById('prog').style.width=pct+'%';
}

// ---- Tasks (Supabase table `tasks`, written to by the dashboard and by voice chats) ----
function isoDay(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// Open tasks, plus anything ticked off today. Older finished tasks stay in the table but leave the list.
function visibleTasks(list){const t=isoDay(new Date());return list.filter(x=>!x.done||(x.done_at&&isoDay(new Date(x.done_at))===t));}
function dueLabel(due){
  if(!due) return '';
  const t=isoDay(new Date()), tm=new Date(); tm.setDate(tm.getDate()+1);
  if(due<t){const n=Math.round((new Date(t)-new Date(due))/864e5);return `<span class="over">${n===1?'Due yesterday':'Overdue '+n+'d'}</span>`;}
  if(due===t) return '<span class="soon">Due today</span>';
  if(due===isoDay(tm)) return '<span class="soon">Due tomorrow</span>';
  const d=new Date(due+'T00:00'); const days=(d-new Date(t+'T00:00'))/864e5;
  return 'Due '+(days<7?DAY_SHORT[d.getDay()]:d.getDate()+' '+MON_SHORT[d.getMonth()]);
}
// Urgent first, then by due date (no date last), then oldest first.
function orderTasks(list){
  return list.slice().sort((a,b)=>{
    const u=(b.tag==='urgent')-(a.tag==='urgent'); if(u) return u;
    const ad=a.due||'9999-12-31', bd=b.due||'9999-12-31'; if(ad!==bd) return ad<bd?-1:1;
    return (a.created_at||'')<(b.created_at||'')?-1:1;
  });
}
const MIC='<svg class="task-voice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-label="Added by voice"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
function taskRow(t){
  const meta=[dueLabel(t.due), t.source==='voice'?MIC+'voice':''].filter(Boolean).join(' · ');
  return `<div class="task-item" data-id="${t.id}">
    <div class="task-check${t.done?' done':''}" role="checkbox" aria-checked="${t.done}" tabindex="0" onclick="toggleTask('${t.id}')" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggleTask('${t.id}')}"></div>
    <div class="task-body">
      <span class="task-text${t.done?' done':''}">${escHtml(t.title)}</span>
      ${t.notes&&!t.done?`<span class="task-note">${escHtml(t.notes)}</span>`:''}
      ${meta&&!t.done?`<span class="task-meta">${meta}</span>`:''}
    </div>
    <span class="task-tag tag-${t.tag}">${t.tag}</span>
    <button class="task-del" onclick="delTask('${t.id}')" aria-label="Delete task">×</button>
  </div>`;
}
function renderTasks() {
  const list=document.getElementById('task-list');
  if(!tasksReady){list.innerHTML='<div class="empty">Loading tasks…</div>';return;}
  let v=visibleTasks(tasks);
  if(taskFilter!=='all') v=v.filter(t=>t.tag===taskFilter);
  const open=orderTasks(v.filter(t=>!t.done)), done=v.filter(t=>t.done).sort((a,b)=>(b.done_at||'')<(a.done_at||'')?-1:1);
  let html=open.map(taskRow).join('');
  if(done.length) html+=`<div class="task-done-hdr">Done today · ${done.length}</div>`+done.map(taskRow).join('');
  list.innerHTML=html||'<div class="empty">'+(taskFilter==='all'?'Nothing on the list':'No '+taskFilter+' tasks')+'</div>';
}
function mergeTask(row){const i=tasks.findIndex(t=>t.id===row.id); if(i<0) tasks.push(row); else tasks[i]=row;}
async function loadTasks(){
  const since=new Date(); since.setHours(0,0,0,0);
  const {data,error}=await sb.from('tasks').select('*').or('done.eq.false,done_at.gte.'+since.toISOString());
  if(error){console.error('tasks load',error);return;}
  tasks=data||[]; tasksReady=true; renderTasks(); renderMetrics();
}
window.toggleTask=async id=>{
  const t=tasks.find(x=>x.id===id); if(!t) return;
  const prev={done:t.done,done_at:t.done_at};
  t.done=!t.done; t.done_at=t.done?new Date().toISOString():null; renderTasks(); renderMetrics();
  const {data,error}=await sb.from('tasks').update({done:t.done}).eq('id',id).select().single();
  if(error){Object.assign(t,prev); renderTasks(); renderMetrics(); alert('Could not save that tick: '+error.message);} else mergeTask(data);
};
window.delTask=async id=>{
  const keep=tasks; tasks=tasks.filter(x=>x.id!==id); renderTasks(); renderMetrics();
  const {error}=await sb.from('tasks').delete().eq('id',id);
  if(error){tasks=keep; renderTasks(); renderMetrics(); alert('Could not delete: '+error.message);}
};
async function addTask(){
  const inp=document.getElementById('task-input');const title=inp.value.trim();if(!title)return;
  const tag=document.getElementById('task-tag').value;
  inp.value='';
  const {data,error}=await sb.from('tasks').insert({title,tag,source:'dashboard'}).select().single();
  if(error){inp.value=title; alert('Could not add task: '+error.message); return;}
  mergeTask(data); renderTasks(); renderMetrics();
}
// One-time move of tasks that were only saved in this browser.
async function migrateLocalTasks(){
  const old=(state.tasks||[]).filter(t=>t&&t.text&&!t.done);
  if(!state.tasks||!state.tasks.length) return;
  if(old.length){
    const {error}=await sb.from('tasks').insert(old.map(t=>({title:t.text,tag:t.tag||'personal',source:'dashboard'})));
    if(error){console.error('task migration',error);return;}
  }
  state.tasks=[]; save();
}
function startTasks(){
  sb.auth.getSession().then(async({data})=>{
    if(!data.session){tasksReady=true; document.getElementById('task-list').innerHTML='<div class="empty">Sign in to see tasks</div>'; return;}
    await migrateLocalTasks();
    await loadTasks();
    sb.channel('tasks-live').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},p=>{
      if(p.eventType==='DELETE') tasks=tasks.filter(t=>t.id!==p.old.id); else mergeTask(p.new);
      renderTasks(); renderMetrics();
    }).subscribe();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadTasks();});
  });
}

// ---- Focus words ----
function renderFocusRow() {
  const days=getWeekDays();
  let html='<div class="wcal-focus-corner"><span class="wcal-focus-corner-label">focus</span></div>';
  days.forEach(d=>{
    const key=dateKey(d);
    const val=(state.focusWords&&state.focusWords[key])||'';
    html+=`<div class="wcal-focus-cell">
      <input class="wcal-focus-input" type="text" maxlength="20" placeholder="add focus..." value="${escHtml(val)}" data-key="${key}" oninput="saveFocus(this)" />
    </div>`;
  });
  document.getElementById('wcal-focus').innerHTML=html;
}
window.saveFocus=function(el){
  if(!state.focusWords) state.focusWords={};
  state.focusWords[el.dataset.key]=el.value.trim();
  save(); renderFocusBanners();
};
function renderFocusBanners(){
  const today=new Date(), tom=new Date(today); tom.setDate(today.getDate()+1);
  [{id:'today-focus-banner',d:today},{id:'tomorrow-focus-banner',d:tom}].forEach(({id,d})=>{
    const key=dateKey(d), word=state.focusWords&&state.focusWords[key];
    const el=document.getElementById(id); if(!el) return;
    el.innerHTML=word?`<div class="focus-banner"><span class="focus-banner-label">Focus</span><span class="focus-banner-word">${escHtml(word)}</span></div>`:'';
  });
}

// ---- Schedule lists ----
function renderSchedList(containerId, targetDate, includeManual) {
  const container=document.getElementById(containerId);
  const now=new Date(), curMins=now.getHours()*60+now.getMinutes();
  const isToday=isSameDay(targetDate,now);

  const calItems=getEventsForDay(targetDate).map(ev=>({
    type:'cal', sortKey:ev.start.dateTime||ev.start.date,
    time:fmtEvTime(ev), title:ev.summary||'(No title)', loc:ev.location||'',
    color:EV_PALETTES[hashStr(ev.id||ev.summary||'')%EV_PALETTES.length],
    mins:(()=>{const d=parseEventStart(ev);return d.getHours()*60+d.getMinutes();})()
  }));

  const manItems=includeManual?state.schedule.map((s,i)=>{
    const [h,m]=s.time.split(':'),mins=parseInt(h)*60+parseInt(m);
    return{type:'manual',sortKey:s.time,time:fmtManualTime(s.time),title:s.text,loc:'',
      color:EV_PALETTES[i%EV_PALETTES.length],mins,_i:i};
  }):[];

  const all=[...calItems,...manItems].sort((a,b)=>a.sortKey.localeCompare(b.sortKey));
  if(!all.length){container.innerHTML='<div class="empty">No events</div>';return;}

  container.innerHTML=all.map(item=>{
    const isNow=isToday&&Math.abs(item.mins-curMins)<60;
    const del=item.type==='manual'?`<button class="sched-del" onclick="delManual(${item._i})">×</button>`:'';
    return`<div class="sched-item">
      <span class="sched-time">${item.time}</span>
      <div class="sched-bar" style="background:${item.color.text}"></div>
      <div class="sched-content">
        <div class="sched-title">${escHtml(item.title)}${isNow?'<span class="sched-now-badge">now</span>':''}</div>
        ${item.loc?`<div class="sched-loc">${escHtml(item.loc)}</div>`:''}
      </div>${del}
    </div>`;
  }).join('');
}
window.delManual=i=>{state.schedule.splice(i,1);save();render();};
function addManual(){
  const tEl=document.getElementById('sched-time'),nEl=document.getElementById('sched-input');
  const text=nEl.value.trim(),time=tEl.value;if(!text||!time)return;
  state.schedule.push({time,text});nEl.value='';tEl.value='';save();render();
}

// ---- Week calendar ----
function renderWeekCal(){
  const days=getWeekDays(),today=new Date(),now=new Date();

  // Header
  let hHtml='<div class="wcal-corner"></div>';
  days.forEach(d=>{
    const isToday=isSameDay(d,today);
    hHtml+=`<div class="wcal-day-head${isToday?' today':''}">
      <div class="wcal-dh-name">${DAY_SHORT[d.getDay()]}</div>
      <div class="wcal-dh-num">${d.getDate()}</div>
    </div>`;
  });
  document.getElementById('wcal-header').innerHTML=hHtml;

  renderFocusRow();

  // All-day
  let adHtml='<div class="wcal-allday-label">all day</div>';
  days.forEach(d=>{
    const isToday=isSameDay(d,today);
    const ads=getAllDayForDay(d);
    const inner=ads.map(ev=>{
      const pal=EV_PALETTES[hashStr(ev.id||ev.summary||'')%EV_PALETTES.length];
      return`<div class="wcal-allday-event" style="background:${pal.bg};color:${pal.text}">${escHtml(ev.summary||'(No title)')}</div>`;
    }).join('');
    adHtml+=`<div class="wcal-allday-cell${isToday?' today-col':''}">${inner}</div>`;
  });
  document.getElementById('wcal-allday').innerHTML=adHtml;

  // Body
  const dayEventMap=days.map(d=>{
    const evs=calEvents.filter(ev=>!isAllDay(ev)&&(()=>{const s=parseEventStart(ev);return s&&isSameDay(s,d);})());
    const mans=isSameDay(d,today)?state.schedule.map((s,i)=>({
      _manual:true,_i:i,summary:s.text,id:'manual_'+i,
      start:{dateTime:(()=>{const dt=new Date(d);const[h,m]=s.time.split(':');dt.setHours(parseInt(h),parseInt(m),0,0);return dt.toISOString();})()},
      end:{dateTime:(()=>{const dt=new Date(d);const[h,m]=s.time.split(':');dt.setHours(parseInt(h)+1,parseInt(m),0,0);return dt.toISOString();})()}
    })):[];
    return[...evs,...mans];
  });

  let bodyHtml='';
  for(let hour=HOUR_START;hour<HOUR_END;hour++){
    const label=hour<12?hour+'am':hour===12?'12pm':(hour-12)+'pm';
    bodyHtml+=`<div class="wcal-time-label">${label}</div>`;
    days.forEach((d,di)=>{
      const isToday=isSameDay(d,today);
      const hourEvs=dayEventMap[di].filter(ev=>{const s=parseEventStart(ev);return s&&s.getHours()===hour;});
      let evHtml='';
      hourEvs.forEach(ev=>{
        const s=parseEventStart(ev),e=parseEventEnd(ev);
        const startMins=s.getMinutes(),durMins=e?Math.max(25,(e-s)/60000):60;
        const topPct=(startMins/60)*100,heightPx=Math.max(14,(durMins/60)*CELL_H);
        const pal=EV_PALETTES[hashStr(ev.id||ev.summary||'')%EV_PALETTES.length];
        evHtml+=`<div class="wcal-event" style="background:${pal.bg};color:${pal.text};top:${topPct}%;height:${heightPx}px;">
          <div class="wcal-event-title">${escHtml(ev.summary||'(No title)')}</div>
          <div class="wcal-event-time">${fmtEvTime(ev)}</div>
        </div>`;
      });
      if(isToday&&now.getHours()===hour){
        evHtml+=`<div class="now-line" style="top:${(now.getMinutes()/60)*100}%"></div>`;
      }
      bodyHtml+=`<div class="wcal-cell${isToday?' today-col':''}">${evHtml}</div>`;
    });
  }
  document.getElementById('wcal-body').innerHTML=bodyHtml;
  const scrollEl=document.getElementById('wcal-scroll');
  setTimeout(()=>{scrollEl.scrollTop=Math.max(0,(now.getHours()-HOUR_START-1))*CELL_H;},50);
}

function renderChat(){
  const el=document.getElementById('chat-messages');
  if(!el) return;
  if(!chatHistory.length){
    el.innerHTML='<div class="chat-empty">Ask me anything — scheduling, coaching cues, content ideas, whatever\'s on your mind.</div>';
    return;
  }
  el.innerHTML=chatHistory.map(m=>{
    if(m.role==='user') return`<div class="chat-bubble user">${escHtml(m.content)}</div>`;
    return`<div class="chat-bubble assistant"><div class="bubble-label">Claude</div>${escHtml(m.content)}</div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}

window.clearChat=function(){chatHistory=[];saveChat();renderChat();};

window.sendChat=async function(){
  const inp=document.getElementById('chat-input');
  const btn=document.getElementById('chat-send-btn');
  const text=inp.value.trim();if(!text)return;
  inp.value='';
  chatHistory.push({role:'user',content:text});
  saveChat();renderChat();
  btn.disabled=true;

  const msgEl=document.getElementById('chat-messages');
  const thinking=document.createElement('div');
  thinking.className='chat-bubble thinking';
  thinking.textContent='Thinking...';
  msgEl.appendChild(thinking);
  msgEl.scrollTop=msgEl.scrollHeight;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:'You are Claude, embedded in Ant Usmar\'s personal dashboard. Ant owns Rev Barbell Club (Olympic weightlifting gym, ~60 members) in Balcatta, Perth WA. He trains BJJ competing in August 2026. He runs @antstrengthcoach on Instagram. He is working on a wearable tech startup called IntelliFight for combat sports. Keep responses concise and direct — no fluff, no em dashes.',
        messages:chatHistory
      })
    });
    const data=await res.json();
    thinking.remove();
    const reply=data.content?.[0]?.text||'Something went wrong — try again.';
    chatHistory.push({role:'assistant',content:reply});
    saveChat();renderChat();
  }catch(e){
    thinking.remove();
    chatHistory.push({role:'assistant',content:'Connection error — check your internet and try again.'});
    saveChat();renderChat();
  }
  btn.disabled=false;
};

document.addEventListener('keydown',e=>{

async function gcal(action,extra){
  const {data,error}=await sb.functions.invoke('gcal',{body:{action,...(extra||{})}});
  if(error){let detail=null;try{detail=await error.context.json()}catch(e){}throw Object.assign(new Error((detail&&detail.error)||error.message),{detail})}
  return data;
}
function setCalConnected(c,label){
  calConnected=c;
  document.getElementById('gcal-btn').classList.toggle('connected',c);
  document.getElementById('gcal-label').textContent=label||(c?'Calendar connected ✓':'Connect Google Calendar');
}
function gcModal(html){
  const el=document.createElement('div');el.className='gc-modal';el.innerHTML=`<div class="gc-card" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(el);el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-gc-close]'))el.remove()});return el;
}
async function handleGcalAuth(){
  let st;try{st=await gcal('status')}catch(e){gcModal(`<h3>Can't reach the calendar service</h3><p>Check you're signed in to the dashboard, then try again.</p><div class="gc-acts"><button class="btn" data-gc-close>Close</button></div>`);return}
  if(st.connected){
    const m=gcModal(`<h3>Google Calendar</h3><p>Connected${st.email?' as <b>'+escHtml(st.email)+'</b>':''}. It stays signed in on every device. Nothing to do here.</p>
      <div class="gc-acts"><button class="btn" data-gc-dis style="color:var(--red)">Disconnect</button><button class="btn" data-gc-refresh>Refresh now</button><button class="btn btn-primary" data-gc-close>Close</button></div>`);
    m.querySelector('[data-gc-refresh]').onclick=async()=>{m.remove();await fetchAllCalendarEvents();render()};
    m.querySelector('[data-gc-dis]').onclick=async e=>{const b=e.target;if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Tap again to disconnect';return}
      try{await gcal('disconnect')}catch(x){}m.remove();calEvents=[];try{localStorage.removeItem(CAL_CACHE)}catch(x){}setCalConnected(false);render()};
    return;
  }
  if(!st.hasSecret){
    const m=gcModal(`<h3>One-time setup</h3><p>Paste the <b>client secret</b> from your Google Cloud OAuth client (the one ending in …tbitl6). It's stored privately in your Supabase database and never shown in the dashboard again.</p>
      <input type="password" id="gc-secret" placeholder="GOCSPX-…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="gc-err" id="gc-err"></p>
      <div class="gc-acts"><button class="btn" data-gc-close>Cancel</button><button class="btn btn-primary" id="gc-save">Save and connect</button></div>`);
    m.querySelector('#gc-save').onclick=async()=>{const v=m.querySelector('#gc-secret').value.trim();if(!v)return;
      try{await gcal('setup',{client_secret:v});m.remove();startGcal()}catch(e){m.querySelector('#gc-err').textContent='Could not save that: '+e.message}};
    setTimeout(()=>m.querySelector('#gc-secret').focus(),30);
    return;
  }
  startGcal();
}
async function startGcal(){
  try{const {url}=await gcal('start',{login_hint:'ant@revbbc.com.au'});location.href=url}
  catch(e){gcModal(`<h3>Couldn't start the Google sign-in</h3><p>${escHtml(e.message)}</p><div class="gc-acts"><button class="btn" data-gc-close>Close</button></div>`)}
}

    cancelled:['Not connected','You cancelled the Google sign-in. Tap Connect Google Calendar to try again.'],
    expired:['That took too long','The sign-in link expired. Tap Connect Google Calendar to try again.'],
    norefresh:['Almost there','Google didn\'t hand over a long-term key. Remove the dashboard from your Google account\'s third-party access, then connect again.'],
    error:['Something went wrong','Check the redirect address in Google Cloud matches exactly, then try again.']}[q]||['Google Calendar',''];
  gcModal(`<h3>${msg[0]}</h3><p>${msg[1]}</p><div class="gc-acts"><button class="btn btn-primary" data-gc-close>OK</button></div>`);

async function fetchAllCalendarEvents(){
  const {mon,sun}=getWeekBounds();
  const tom=new Date();tom.setDate(tom.getDate()+2);tom.setHours(23,59,59,999);
  const timeMin=mon.toISOString(),timeMax=(tom>sun?tom:sun).toISOString();
  try{
    const r=await gcal('events',{timeMin,timeMax});
    if(!r.connected){setCalConnected(false);calEvents=[];return}
    setCalConnected(true);calEvents=r.events||[];
    try{localStorage.setItem(CAL_CACHE,JSON.stringify({at:Date.now(),events:calEvents}))}catch(e){}
  }catch(e){
    console.error('Calendar fetch error',e);
    if(e.message==='reconnect') setCalConnected(false,'Reconnect Google Calendar');
  }
}
function loadCachedEvents(){try{const c=JSON.parse(localStorage.getItem(CAL_CACHE)||'null');if(c&&Date.now()-c.at<7*864e5){calEvents=c.events||[];setCalConnected(true)}}catch(e){}}

    rows.addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(b){ draft.splice(+b.dataset.rm,1); draw(); } });
    m.querySelector('#lf-add').onclick=()=>{ draft.push({id:Date.now().toString(36),title:'',date:'',theme:'camping'}); draw(); rows.querySelector('.lf-row:last-child input').focus(); };
    m.querySelector('#lf-save').onclick=async()=>{ events=draft.filter(e=>(e.title||'').trim()).map(e=>({...e,title:e.title.trim(),id:e.id||Date.now().toString(36)})); idx=0; el.dataset.scene=''; m.remove(); tickLoop(); await save(); };
  }
  el.addEventListener('click',editor);
  tickLoop();
  sb.auth.getSession().then(async({data})=>{ if(!data.session) return; const {data:r}=await sb.from('settings').select('value').eq('key',LF_KEY).maybeSingle();
    if(r&&r.value&&Array.isArray(r.value.events)){ events=r.value.events; try{localStorage.setItem('lf-cache',JSON.stringify(events))}catch(e){} el.dataset.scene=''; tickLoop(); } });
})();

(function(){
  /* The road to the dream life: day 1 is Mon 5 Oct 2026, the last day is Sat 3 Jan 2032 (1,917 days). */
  const start=new Date(2026,9,5), last=new Date(2032,0,3), DAY=864e5, end=new Date(2032,0,4);
  const total=Math.round((last-start)/DAY)+1, now=new Date(); now.setHours(0,0,0,0);
  const el=document.getElementById('dream'), n=x=>x.toLocaleString('en-AU');
  if(now<start){ const left=Math.round((start-now)/DAY); el.innerHTML=`<b>${n(left)}</b> day${left===1?'':'s'} until day 1 of ${n(total)} to living your dream life.`; }
  else { const d=Math.min(total,Math.floor((now-start)/DAY)+1);
    el.innerHTML=d>=total&&now>=end?`Day <b>${n(total)}</b> of ${n(total)}. You built it.`:`You are day <b>${n(d)}</b> of ${n(total)} to living your dream life.<span class="bar"><i style="width:${(d/total*100).toFixed(2)}%"></i></span>`; }
})();
loadCachedEvents();
gcalReturnNotice();
sb.auth.getSession().then(({data})=>{if(data.session)fetchAllCalendarEvents().then(render);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&calConnected)fetchAllCalendarEvents().then(render);});

load();
loadChat();
render();
startTasks();
renderChat();
setInterval(render,60000);
window.addEventListener('rev:routine',renderMetrics);
setInterval(()=>{if(calConnected)fetchAllCalendarEvents().then(render);},10*60*1000);
</script>
