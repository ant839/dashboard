<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rev app icon: a target with an Olympic barbell through the bullseye -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#1c2016"/>
      <stop offset="1" stop-color="#09090a"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#d9d9d4"/>
      <stop offset=".55" stop-color="#9c9c97"/>
      <stop offset="1" stop-color="#e6e6e1"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8e3"/>
      <stop offset="1" stop-color="#8e8e89"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5d57"/>
      <stop offset=".55" stop-color="#d7263d"/>
      <stop offset="1" stop-color="#a51b2e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset=".55" stop-color="#1f62d6"/>
      <stop offset="1" stop-color="#1647a0"/>
    </linearGradient>
    <pattern id="knurl" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="none"/>
      <path d="M0 0v6M3 0v6" stroke="#2a2a2a" stroke-opacity=".55" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- target -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#c8f06a" stroke-opacity=".22" stroke-width="16"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#c8f06a" stroke-opacity=".45" stroke-width="16"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#c8f06a" stroke-opacity=".75" stroke-width="16"/>
  <circle cx="256" cy="256" r="58" fill="#c8f06a"/>
  <circle cx="256" cy="256" r="58" fill="none" stroke="#0b0b0c" stroke-opacity=".25" stroke-width="4"/>

  <!-- dark outline so the bar reads over the bullseye -->
  <rect x="116" y="246" width="280" height="20" rx="10" fill="#0b0b0c" opacity=".85"/>
  <rect x="18" y="240" width="476" height="32" rx="8" fill="#0b0b0c" opacity=".55"/>
  <!-- Olympic bar: shaft with knurling (smooth ring each side of centre knurl) -->
  <rect x="120" y="250" width="272" height="12" rx="6" fill="url(#shaft)"/>
  <rect x="136" y="250" width="72" height="12" fill="url(#knurl)"/>
  <rect x="236" y="250" width="40" height="12" fill="url(#knurl)"/>
  <rect x="304" y="250" width="72" height="12" fill="url(#knurl)"/>
  <!-- inner collars (sleeve stops) -->
  <rect x="110" y="238" width="12" height="36" rx="3" fill="url(#chrome)"/>
  <rect x="390" y="238" width="12" height="36" rx="3" fill="url(#chrome)"/>
  <!-- sleeves -->
  <rect x="22" y="244" width="90" height="24" rx="5" fill="url(#chrome)"/>
  <rect x="400" y="244" width="90" height="24" rx="5" fill="url(#chrome)"/>

  <!-- bumper plates: red 25 kg, blue 20 kg, both full size, then a competition collar -->
  <rect x="84" y="140" width="26" height="232" rx="7" fill="url(#red)" stroke="#0b0b0c" stroke-width="3"/>
  <rect x="58" y="140" width="26" height="232" rx="7" fill="url(#blue)" stroke="#0b0b0c" stroke-width="3"/>
  <rect x="42" y="236" width="12" height="40" rx="3" fill="#0e0e0f" stroke="#e6e6e1" stroke-width="3"/>
  <rect x="402" y="140" width="26" height="232" rx="7" fill="url(#red)" stroke="#0b0b0c" stroke-width="3"/>
  <rect x="428" y="140" width="26" height="232" rx="7" fill="url(#blue)" stroke="#0b0b0c" stroke-width="3"/>
  <rect x="458" y="236" width="12" height="40" rx="3" fill="#0e0e0f" stroke="#e6e6e1" stroke-width="3"/>
  <!-- plate face highlight -->
  <path d="M65 152v208M91 152v208M409 152v208M435 152v208" stroke="#ffffff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
</svg>
