<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rev app icon: a loaded barbell from the side, plates in the dashboard's lime -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#20231b"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcff85"/>
      <stop offset="1" stop-color="#a6d43c"/>
    </linearGradient>
    <linearGradient id="lime2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8e25a"/>
      <stop offset="1" stop-color="#7fa82a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f3ee"/>
      <stop offset="1" stop-color="#a9a9a4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 257) scale(1.2) translate(-256 -257)">
  <!-- soft glow behind the bar -->
  <ellipse cx="256" cy="262" rx="210" ry="120" fill="#c8f06a" opacity=".07"/>
  <!-- bar -->
  <rect x="36" y="248" width="440" height="18" rx="9" fill="url(#steel)"/>
  <!-- knurling marks -->
  <g stroke="#0e0e0f" stroke-opacity=".35" stroke-width="3">
    <path d="M214 250v14M228 250v14M242 250v14M270 250v14M284 250v14M298 250v14"/>
  </g>
  <!-- left: big plate, second plate, change plate, collar -->
  <rect x="92" y="128" width="40" height="258" rx="10" fill="url(#lime)"/>
  <rect x="136" y="162" width="30" height="190" rx="8" fill="url(#lime2)"/>
  <rect x="170" y="206" width="16" height="102" rx="5" fill="url(#steel)"/>
  <rect x="188" y="236" width="14" height="42" rx="4" fill="#0e0e0f" stroke="#f4f3ee" stroke-width="4"/>
  <!-- right: mirror -->
  <rect x="380" y="128" width="40" height="258" rx="10" fill="url(#lime)"/>
  <rect x="346" y="162" width="30" height="190" rx="8" fill="url(#lime2)"/>
  <rect x="326" y="206" width="16" height="102" rx="5" fill="url(#steel)"/>
  <rect x="310" y="236" width="14" height="42" rx="4" fill="#0e0e0f" stroke="#f4f3ee" stroke-width="4"/>
  <!-- plate edge highlights -->
  <path d="M100 140v234M388 140v234" stroke="#ffffff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
