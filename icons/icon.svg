<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1430"/>
      <stop offset=".55" stop-color="#2a2550"/>
      <stop offset="1" stop-color="#6b3f4c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".62" r=".6">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#ff8a4a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff8a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b07e5a"/><stop offset=".55" stop-color="#d9a37a"/><stop offset="1" stop-color="#b98560"/></linearGradient>
    <linearGradient id="skinR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c99a7c"/><stop offset=".55" stop-color="#ecc3a4"/><stop offset="1" stop-color="#d3a585"/></linearGradient>
    <linearGradient id="skinK" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6a988"/><stop offset=".55" stop-color="#f3cfb2"/><stop offset="1" stop-color="#dcb091"/></linearGradient>
    <linearGradient id="rash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a55d6"/><stop offset="1" stop-color="#173a9e"/></linearGradient>
    <linearGradient id="jumper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e3e0"/><stop offset="1" stop-color="#b9b8b5"/></linearGradient>
    <linearGradient id="blonde" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b46e"/><stop offset="1" stop-color="#a77c3f"/></linearGradient>
    <pattern id="stripe" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#24324f"/><rect y="12" width="20" height="6" fill="#e9e4d8"/></pattern>
    <linearGradient id="pup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eab76c"/><stop offset="1" stop-color="#c88c42"/></linearGradient>
    <linearGradient id="rott" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2220"/><stop offset="1" stop-color="#161211"/></linearGradient>
    <linearGradient id="dog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2a85a"/><stop offset="1" stop-color="#bf8238"/></linearGradient>
    <pattern id="flanno" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
      <rect width="44" height="44" fill="#a8262c"/>
      <rect x="0" y="14" width="44" height="14" fill="#1c1012" opacity=".55"/>
      <rect x="14" y="0" width="14" height="44" fill="#1c1012" opacity=".55"/>
      <rect x="0" y="34" width="44" height="2.5" fill="#e9b7a8" opacity=".35"/>
      <rect x="34" y="0" width="2.5" height="44" fill="#e9b7a8" opacity=".35"/>
    </pattern>
    <radialGradient id="shine" cx=".4" cy=".3" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g fill="#fff">
    <circle cx="60" cy="70" r="2.2" opacity=".8"/><circle cx="110" cy="40" r="1.6" opacity=".6"/><circle cx="430" cy="58" r="2.2" opacity=".8"/>
    <circle cx="470" cy="120" r="1.6" opacity=".6"/><circle cx="40" cy="150" r="1.6" opacity=".55"/><circle cx="380" cy="30" r="1.6" opacity=".6"/>
  </g>
  <!-- rolling hills at dusk -->
  <path d="M0,232 Q70,196 150,214 Q230,232 300,200 Q390,166 512,206 L512,512 L0,512 Z" fill="#3b3a5c"/>
  <path d="M0,262 Q90,226 190,250 Q280,272 360,240 Q440,212 512,236 L512,512 L0,512 Z" fill="#33503f"/>
  <!-- big two-storey homestead (left) -->
  <g>
    <!-- main two-storey block -->
    <rect x="-6" y="182" width="150" height="96" fill="#ece1cb"/>
    <path d="M-16,186 L32,140 L104,140 L152,186 Z" fill="#5e3530"/>
    <rect x="18" y="150" width="9" height="22" fill="#5e3530"/><rect x="108" y="146" width="9" height="20" fill="#5e3530"/>
    <!-- dormer -->
    <path d="M56,170 L68,154 L80,170 Z" fill="#5e3530"/><rect x="62" y="166" width="12" height="10" fill="#ffd27a"/>
    <!-- upstairs windows -->
    <rect x="6" y="196" width="16" height="18" fill="#ffd27a"/><rect x="34" y="196" width="16" height="18" fill="#ffd27a"/>
    <rect x="86" y="196" width="16" height="18" fill="#ffd27a"/><rect x="114" y="196" width="16" height="18" fill="#ffd27a"/>
    <!-- wraparound verandah -->
    <path d="M-10,230 L148,230 L156,242 L-10,242 Z" fill="#7a4a3f"/>
    <g stroke="#f4ecdc" stroke-width="3"><path d="M2,242 V278 M38,242 V278 M74,242 V278 M110,242 V278 M144,242 V278"/></g>
    <path d="M-10,264 H152" stroke="#f4ecdc" stroke-width="2.5"/>
    <!-- downstairs windows and front door -->
    <rect x="12" y="248" width="18" height="16" fill="#ffd27a"/><rect x="48" y="248" width="18" height="16" fill="#ffd27a"/>
    <rect x="80" y="246" width="16" height="32" fill="#5a3b2a"/>
    <rect x="114" y="248" width="18" height="16" fill="#ffd27a"/>
    <rect x="-6" y="182" width="150" height="96" fill="#000" opacity=".12"/>
  </g>
  <path d="M0,300 Q110,262 230,286 Q330,306 420,276 Q470,262 512,270 L512,512 L0,512 Z" fill="#2c4636"/>
  <path d="M0,262 Q90,226 190,250 Q280,272 360,240 Q440,212 512,236" fill="none" stroke="#f3b866" stroke-width="2" opacity=".35"/>
  <!-- fence line -->
  <g stroke="#1e2f26" stroke-width="2.5" opacity=".8">
    <path d="M0,292 Q60,282 120,284" fill="none"/>
    <path d="M10,288 v12 M40,284 v12 M70,282 v12 M100,282 v12"/>
  </g>
  <!-- barn (right) -->
  <g>
    <rect x="432" y="196" width="66" height="50" fill="#b8392f"/>
    <path d="M426,198 L446,170 L484,170 L504,198 Z" fill="#7a2620"/>
    <path d="M426,198 L446,170 L484,170 L504,198" fill="none" stroke="#efe6d8" stroke-width="2.5"/>
    <rect x="452" y="214" width="26" height="32" fill="#8a2a23" stroke="#efe6d8" stroke-width="2.5"/>
    <path d="M452,214 L478,246 M478,214 L452,246" stroke="#efe6d8" stroke-width="2"/>
    <rect x="458" y="180" width="14" height="10" fill="#ffd27a" opacity=".85"/>
    <rect x="432" y="196" width="66" height="50" fill="#000" opacity=".12"/>
  </g>
  <!-- cow grazing between the heads -->
  <g transform="translate(240,236)">
    <ellipse cx="22" cy="14" rx="20" ry="11" fill="#f2efe8"/>
    <path d="M10,8 q6,-4 10,2 q-2,6 -10,4 Z M26,14 q8,-5 12,2 q-4,6 -12,2 Z" fill="#1c1a1a"/>
    <rect x="7" y="20" width="4" height="12" fill="#f2efe8"/><rect x="15" y="21" width="4" height="11" fill="#e3ddd2"/>
    <rect x="28" y="21" width="4" height="11" fill="#e3ddd2"/><rect x="35" y="20" width="4" height="12" fill="#f2efe8"/>
    <ellipse cx="45" cy="19" rx="7" ry="6" fill="#f2efe8"/><ellipse cx="49" cy="22" rx="4" ry="3" fill="#e8b1a4"/>
    <path d="M42,13 l-3,-4 M47,13 l2,-4" stroke="#d9c9a8" stroke-width="2" stroke-linecap="round"/>
    <path d="M2,12 q-4,6 -2,12" stroke="#f2efe8" stroke-width="2" fill="none"/>
  </g>

  <!-- ===== Renee (back left) ===== -->
  <g>
    <!-- bun behind head -->
    <ellipse cx="150" cy="152" rx="26" ry="23" fill="#2a1d18"/>
    <!-- grey jumper -->
    <path d="M70,512 L78,372 Q86,322 140,306 L178,296 L232,304 Q262,318 270,352 L276,512 Z" fill="url(#jumper)"/>
    <path d="M158,298 L180,326 L204,298" fill="none" stroke="#a9a8a5" stroke-width="5" stroke-linejoin="round"/>
    <path d="M172,324 L180,326 L188,324" stroke="#9c9b98" stroke-width="3" fill="none"/>
    <!-- neck -->
    <path d="M166,262 L166,302 Q181,312 196,302 L196,262 Z" fill="#c8977a"/>
    <!-- face -->
    <path d="M136,206 Q136,152 181,152 Q226,152 226,206 L226,236 Q226,262 206,278 Q194,288 181,288 Q168,288 156,278 Q136,262 136,236 Z" fill="url(#skinR)"/>
    <!-- slicked hair with middle part -->
    <path d="M133,214 Q128,150 181,140 Q234,150 229,214 Q222,180 206,172 Q194,166 181,170 Q168,166 156,172 Q140,180 133,214 Z" fill="#2a1d18"/>
    <path d="M181,142 L181,170" stroke="#4a362c" stroke-width="2.5" opacity=".7"/>
    <!-- ears + gold hoops -->
    <ellipse cx="135" cy="228" rx="7" ry="11" fill="#c8977a"/><ellipse cx="227" cy="228" rx="7" ry="11" fill="#c8977a"/>
    <circle cx="134" cy="246" r="6.5" fill="none" stroke="#e7c35a" stroke-width="3"/><circle cx="228" cy="246" r="6.5" fill="none" stroke="#e7c35a" stroke-width="3"/>
    <ellipse cx="170" cy="190" rx="22" ry="12" fill="url(#shine)"/>
  </g>

  <!-- ===== Ant (back right) ===== -->
  <g>
    <!-- flannel shirt, broad -->
    <path d="M236,512 L242,360 Q250,300 314,284 L340,278 L386,278 L412,284 Q476,300 484,360 L492,512 Z" fill="url(#flanno)"/>
    <path d="M236,512 L242,360 Q250,300 314,284 L340,278 L386,278 L412,284 Q476,300 484,360 L492,512 Z" fill="#000" opacity=".12"/>
    <!-- open collar showing neck -->
    <path d="M330,276 L363,326 L396,276 Z" fill="#a8774f"/>
    <path d="M326,272 L363,326 L340,334 L314,290 Z" fill="url(#flanno)" stroke="#5e1418" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M400,272 L363,326 L386,334 L412,290 Z" fill="url(#flanno)" stroke="#5e1418" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M363,326 L363,512" stroke="#5e1418" stroke-width="3"/>
    <circle cx="370" cy="356" r="3.5" fill="#efe6d8"/><circle cx="370" cy="400" r="3.5" fill="#efe6d8"/><circle cx="370" cy="444" r="3.5" fill="#efe6d8"/>
    <!-- thick neck -->
    <path d="M326,226 L326,280 Q363,300 400,280 L400,226 Z" fill="#a8774f"/>
    <path d="M336,250 L350,296 M390,250 L376,296" stroke="#8a5f40" stroke-width="3.5" stroke-linecap="round" opacity=".45"/>
    <!-- square head -->
    <path d="M311,158 Q311,96 363,96 Q415,96 415,158 L417,214 L414,240 Q412,254 399,256 L327,256 Q314,254 312,240 L309,214 Z" fill="url(#skinA)"/>
    <!-- beard following the square jaw -->
    <path d="M309,196 L312,240 Q314,254 327,256 L399,256 Q412,254 414,240 L417,196 Q412,226 396,232 Q380,236 363,236 Q346,236 330,232 Q314,226 309,196 Z" fill="#5a3b26" opacity=".88"/>
    <path d="M309,196 L312,240 Q314,254 327,256 L363,256 L363,248 L330,248 Q320,246 318,236 L314,194 Z" fill="#3a2618" opacity=".35"/>
    <!-- short faded hair, a little quiff -->
    <path d="M309,166 Q303,104 352,94 Q392,86 412,110 Q424,128 417,168 Q413,140 398,130 Q382,122 362,124 Q334,126 322,140 Q312,150 309,166 Z" fill="#4a3022"/>
    <path d="M328,104 Q356,82 394,94 Q374,94 356,102 Z" fill="#5c3c2a"/>
    <path d="M309,166 Q307,150 313,140 L315,184 Z M417,168 Q419,150 413,140 L411,184 Z" fill="#4a3022" opacity=".45"/>
    <!-- ears -->
    <ellipse cx="309" cy="196" rx="8" ry="14" fill="#a8774f"/><ellipse cx="417" cy="196" rx="8" ry="14" fill="#a8774f"/>
    <ellipse cx="350" cy="140" rx="24" ry="12" fill="url(#shine)"/>
  </g>

  <!-- ===== Kids, second row, shoulder to shoulder ===== -->
  <!-- boy (right) -->
  <g>
    <path d="M246,512 L250,452 Q256,420 290,412 L346,412 Q380,420 386,452 L390,512 Z" fill="url(#stripe)"/>
    <path d="M296,414 Q318,430 340,414" fill="none" stroke="#24324f" stroke-width="6"/>
    <path d="M306,384 L306,416 Q318,424 330,416 L330,384 Z" fill="#dcae8e"/>
    <ellipse cx="318" cy="350" rx="39" ry="43" fill="url(#skinK)"/>
    <path d="M277,352 Q270,300 318,296 Q368,298 360,352 Q356,326 342,320 L332,330 L326,316 L312,326 L308,314 L296,326 Q282,330 277,352 Z" fill="url(#blonde)"/>
    <ellipse cx="279" cy="356" rx="6" ry="9" fill="#dcae8e"/><ellipse cx="357" cy="356" rx="6" ry="9" fill="#dcae8e"/>
    <ellipse cx="310" cy="316" rx="17" ry="7" fill="url(#shine)"/>
  </g>
  <!-- girl (left) -->
  <g>
    <path d="M128,512 L132,452 Q138,420 172,412 L228,412 Q262,420 268,452 L272,512 Z" fill="#a98bd4"/>
    <path d="M176,413 Q188,432 200,422 Q212,432 224,413 L216,410 Q200,420 184,410 Z" fill="#f4f0ea"/>
    <path d="M188,382 L188,414 Q200,422 212,414 L212,382 Z" fill="#dcae8e"/>
    <!-- ponytail on her outside shoulder -->
    <path d="M162,312 Q126,322 132,370 Q138,396 154,402 Q146,370 160,340 Z" fill="url(#blonde)"/>
    <ellipse cx="200" cy="348" rx="39" ry="44" fill="url(#skinK)"/>
    <path d="M158,372 Q148,296 200,292 Q252,296 242,372 Q240,336 232,322 Q216,308 200,312 Q184,308 168,322 Q160,336 158,372 Z" fill="url(#blonde)"/>
    <path d="M200,295 L200,312" stroke="#8a6532" stroke-width="2" opacity=".6"/>
    <circle cx="160" cy="318" r="6.5" fill="#a98bd4"/>
    <ellipse cx="190" cy="314" rx="17" ry="7" fill="url(#shine)"/>
  </g>

  <!-- ===== Puppies, front row ===== -->
  <!-- golden retriever puppy (left) -->
  <g transform="translate(196,512) scale(1.12) translate(-196,-512)">
    <path d="M136,512 Q138,478 196,472 Q254,478 256,512 Z" fill="url(#pup)"/>
    <path d="M178,486 q6,10 0,22 M196,482 q6,12 0,26 M214,486 q6,10 0,22" stroke="#f5d39b" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="196" cy="448" rx="44" ry="38" fill="url(#pup)"/>
    <path d="M160,424 Q136,428 136,456 Q136,480 152,486 Q162,470 164,448 Z" fill="#c4863b"/>
    <path d="M232,424 Q256,428 256,456 Q256,480 240,486 Q230,470 228,448 Z" fill="#c4863b"/>
    <ellipse cx="196" cy="468" rx="20" ry="15" fill="#f6d7a4"/>
    <ellipse cx="196" cy="459" rx="7.5" ry="5.5" fill="#2b1d16"/>
    <ellipse cx="186" cy="428" rx="14" ry="7" fill="url(#shine)"/>
  </g>
  <!-- rottweiler puppy (right) -->
  <g transform="translate(320,512) scale(1.12) translate(-320,-512)">
    <path d="M262,512 Q264,478 320,472 Q376,478 378,512 Z" fill="url(#rott)"/>
    <path d="M300,476 Q320,500 340,476 Q336,506 320,512 Q304,506 300,476 Z" fill="#b8692e"/>
    <ellipse cx="320" cy="448" rx="44" ry="38" fill="url(#rott)"/>
    <path d="M286,422 Q268,420 266,440 Q272,454 286,448 Z M354,422 Q372,420 374,440 Q368,454 354,448 Z" fill="#110d0c"/>
    <path d="M296,458 Q296,446 320,446 Q344,446 344,458 Q344,484 320,486 Q296,484 296,458 Z" fill="#b8692e"/>
    <ellipse cx="320" cy="457" rx="7.5" ry="5.5" fill="#0a0707"/>
    <ellipse cx="310" cy="426" rx="14" ry="7" fill="#fff" opacity=".08"/>
  </g>
</svg>
