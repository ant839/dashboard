<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-title" content="Rev">
<title>Brain Dump · Rev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0f; --surface:#161618; --surface2:#1e1e21;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
  --text:#f0efe8; --muted:#888884; --dim:#4a4a48;
  --accent:#c8f06a; --accent-dim:rgba(200,240,106,0.12);
  --red:#ff5a5a; --red-dim:rgba(255,90,90,0.14);
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.14);
  --blue:#5ab4ff; --blue-dim:rgba(90,180,255,0.12);
  --purple:#b08fff; --purple-dim:rgba(176,143,255,0.13);
  --teal:#3dd6b5; --teal-dim:rgba(61,214,181,0.12);
  --radius:10px; --radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;min-height:100vh;padding:calc(22px + env(safe-area-inset-top,0px)) 26px calc(80px + env(safe-area-inset-bottom,0px))}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--text)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--border2)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
h1{font-size:28px;font-weight:300;letter-spacing:-.02em}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--border2)}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.card-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* capture */
.cap textarea{width:100%;min-height:120px;resize:vertical;font-size:15px;line-height:1.5;padding:12px 14px}
.cap-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.cap-foot .grow{flex:1}
.hint{font-size:11px;color:var(--muted);line-height:1.5}
.chipset{display:flex;gap:4px;flex-wrap:wrap}
.chipset button{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted)}
.chipset button.on{background:var(--surface2);border-color:var(--accent);color:var(--text)}

/* list */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 10px}
.bar input[type=search]{flex:1 1 180px;max-width:280px}
.day{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.day::after{content:'';flex:1;height:1px;background:var(--border)}
.dump{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border-left:3px solid var(--accent)}
.dump.done{border-left-color:var(--dim);opacity:.65}
.dump.rough{border-left-color:var(--amber)}
.d-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.d-title{flex:1;font-size:15px;font-weight:500;line-height:1.35}
.d-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:3px;font-weight:400}
.tag{font-size:10px;font-weight:600;padding:1px 8px;border-radius:20px;letter-spacing:.04em;text-transform:lowercase}
.tag-gym{background:var(--blue-dim);color:var(--blue)}
.tag-business{background:var(--teal-dim);color:var(--teal)}
.tag-personal{background:var(--amber-dim);color:var(--amber)}
.tag-social{background:var(--purple-dim);color:var(--purple)}
.tag-ideas{background:var(--accent-dim);color:var(--accent)}
.rough-note{color:var(--amber)}
.mic{width:11px;height:11px;vertical-align:-1px}
ul.pts{list-style:none;display:flex;flex-direction:column}
ul.pts li{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:14px;line-height:1.45}
ul.pts li:first-child{border-top:0}
ul.pts li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
.dump.done ul.pts li::before{background:var(--dim)}
ul.pts li span{flex:1}
.to-task{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);font-size:11px;padding:2px 8px;white-space:nowrap;flex-shrink:0}
.to-task:hover{color:var(--text);border-color:var(--border2)}
.to-task.sent{color:var(--accent);border-color:transparent;cursor:default}
.raw{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.55;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;white-space:pre-wrap}
.d-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.d-acts button{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);font-size:11px;padding:4px 10px}
.d-acts button:hover{color:var(--text);border-color:var(--border2)}
.d-acts .del:hover{color:var(--red)}
.edit input{width:100%;margin-bottom:8px;font-size:14px}
.edit textarea{width:100%;min-height:140px;font-size:14px;line-height:1.5}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:30px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:13px;z-index:50;max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--accent);font-weight:600}
@media (max-width:640px){
  body{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(70px + env(safe-area-inset-bottom,0px))}
  h1{font-size:24px}
  .dump{padding:12px 13px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="wrap">
  <div class="head">
    <div><div class="eyebrow">Get it out of your head</div><h1>Brain Dump</h1></div>
  </div>

  <div class="card cap">
    <div class="card-label">New dump</div>
    <textarea id="dumpIn" placeholder="Whatever's in your head. Ramble, it gets split into points."></textarea>
    <div class="cap-foot">
      <div class="chipset" id="capTag" role="group" aria-label="Tag">
        <button type="button" data-t="" class="on">No tag</button><button type="button" data-t="gym">Gym</button><button type="button" data-t="business">Business</button><button type="button" data-t="social">Social</button><button type="button" data-t="personal">Personal</button><button type="button" data-t="ideas">Ideas</button>
      </div>
      <span class="grow"></span>
      <button class="btn primary" id="saveBtn" type="button">Save dump</button>
    </div>
    <p class="hint" style="margin-top:8px">Typed here it gets a quick split into points. Dumps from your car thread come in properly cleaned up.</p>
  </div>

  <div class="bar">
    <div class="chipset" id="filt">
      <button type="button" data-f="open" class="on">Open</button><button type="button" data-f="done">Done</button><button type="button" data-f="all">All</button>
    </div>
    <input type="search" id="q" placeholder="Search dumps" aria-label="Search dumps">
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>

<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="rev.js?v=29"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const MIC='<svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const TASK_TAG={gym:"gym",business:"business",social:"business",personal:"personal"};

let dumps=[], filter="open", query="", capTag="", editing=null, openRaw=new Set();
revRenderNav($("#app"));

function toast(msg,actLabel,act){const t=$("#toast");$("#toastMsg").textContent=msg;const b=$("#toastAct");b.hidden=!act;b.textContent=actLabel||"";b.onclick=()=>{t.hidden=true;act&&act()};t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,act?7000:3000)}
function fail(e){console.error(e);toast("Couldn't save that. Check your connection and try again.");load()}

/* Quick tidy for typed dumps: strip filler, split into one idea per line, capitalise.
   The car thread does the real clean-up; this just makes typed ones readable. */
const FILLER=/\b(u+m+|u+h+|e+r+m+|a+h+|you know|i mean|sort of|kind of|basically|so yeah|yeah so|okay so|ok so)\b,?\s*/gi;
function quickTidy(text){
  let t=String(text).replace(/\r/g,"").trim();
  let parts;
  const lines=t.split("\n").map(s=>s.trim()).filter(Boolean);
  if(lines.length>1) parts=lines;
  else parts=t.replace(/\s+/g," ").split(/(?<=[.!?])\s+|\s+(?:and then|also|another thing is|another thing)\s+/i);
  return parts.map(p=>p.replace(/^[-*•\d.)\s]+/,"").replace(FILLER,"").replace(/\blike,\s*/gi,"")
      .replace(/\b(to|just|i|we|gonna|should|could) like\b/gi,"$1").replace(/^(?:(?:and|so|but|then|also|ok|okay|right|oh)\b[,\s]*)+/i,"").replace(/\s+/g," ").replace(/[.,;\s]+$/,"").trim())
    .filter(p=>p.length>2).map(p=>p[0].toUpperCase()+p.slice(1));
}
function titleFrom(points){const w=(points[0]||"Brain dump").split(" ");return w.slice(0,6).join(" ")+(w.length>6?"…":"")}

async function saveDump(){
  const raw=$("#dumpIn").value.trim(); if(!raw) return;
  const points=quickTidy(raw); const btn=$("#saveBtn"); btn.disabled=true;
  const {data,error}=await sb.from("brain_dumps").insert({title:titleFrom(points),points:points.length?points:[raw],raw,tag:capTag||null,source:"dashboard",tidied:false}).select().single();
  btn.disabled=false;
  if(error) return fail(error);
  $("#dumpIn").value=""; merge(data); render(); toast("Saved");
}

function merge(r){const i=dumps.findIndex(d=>d.id===r.id); if(i<0) dumps.unshift(r); else dumps[i]=r;}
function dayLabel(ts){
  const d=new Date(ts), t=new Date(), y=new Date(); y.setDate(t.getDate()-1);
  if(iso(d)===iso(t)) return "Today"; if(iso(d)===iso(y)) return "Yesterday";
  return d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});
}
const timeOf=ts=>new Date(ts).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"}).replace(" ","").toLowerCase();

function dumpCard(d){
  const sent=new Set(d.sent||[]);
  if(editing===d.id) return `<div class="dump" data-id="${d.id}"><div class="edit">
      <input id="edTitle" value="${esc(d.title||"")}" placeholder="Heading" aria-label="Heading">
      <textarea id="edPts" aria-label="Points, one per line">${esc((d.points||[]).join("\n"))}</textarea>
      <p class="hint" style="margin:6px 0 0">One point per line.</p>
      <div class="d-acts"><button type="button" data-act="edsave" style="color:var(--accent);border-color:var(--accent)">Save</button><button type="button" data-act="edcancel">Cancel</button></div>
    </div></div>`;
  return `<div class="dump${d.status==="done"?" done":""}${!d.tidied&&d.status!=="done"?" rough":""}" data-id="${d.id}">
    <div class="d-top"><div class="d-title">${esc(d.title||"Brain dump")}
      <div class="d-meta">${timeOf(d.created_at)}${d.source==="voice"?` · ${MIC} car`:""}${d.tag?` <span class="tag tag-${esc(d.tag)}">${esc(d.tag)}</span>`:""}${!d.tidied?` · <span class="rough-note">quick split</span>`:""}</div></div></div>
    <ul class="pts">${(d.points||[]).map((p,i)=>`<li><span>${esc(p)}</span>${sent.has(i)?`<button class="to-task sent" type="button" disabled>✓ In tasks</button>`:`<button class="to-task" type="button" data-act="task" data-i="${i}" aria-label="Add to tasks">+ Task</button>`}</li>`).join("")}</ul>
    ${d.raw&&openRaw.has(d.id)?`<div class="raw">${esc(d.raw)}</div>`:""}
    <div class="d-acts">
      <button type="button" data-act="done">${d.status==="done"?"Reopen":"Done"}</button>
      <button type="button" data-act="copy">Copy</button>
      <button type="button" data-act="edit">Edit</button>
      ${d.raw?`<button type="button" data-act="raw">${openRaw.has(d.id)?"Hide":"Show"} what I said</button>`:""}
      <button type="button" class="del" data-act="del">Delete</button>
    </div></div>`;
}

function render(){
  let v=dumps.slice().sort((a,b)=>a.created_at<b.created_at?1:-1);
  if(filter!=="all") v=v.filter(d=>d.status===filter);
  if(query) v=v.filter(d=>[d.title,d.raw,...(d.points||[])].join(" ").toLowerCase().includes(query));
  if(!v.length){$("#list").innerHTML=`<div class="empty">${query?"Nothing matches that search":filter==="open"?"Head's clear. Nothing open.":"Nothing here yet"}</div>`;return}
  let html="", last="";
  v.forEach(d=>{const l=dayLabel(d.created_at); if(l!==last){html+=`<div class="day">${l}</div>`;last=l} html+=dumpCard(d)});
  $("#list").innerHTML=html;
  if(editing){const t=$("#edPts"); t&&t.focus();}
}

async function update(d,patch){const prev={...d};Object.assign(d,patch);render();
  const {data,error}=await sb.from("brain_dumps").update(patch).eq("id",d.id).select().single();
  if(error){Object.assign(d,prev);render();return fail(error)} merge(data);render();}

$("#list").addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const d=dumps.find(x=>x.id===b.closest("[data-id]").dataset.id); if(!d) return;
  const act=b.dataset.act;
  if(act==="task"){
    const i=+b.dataset.i; b.disabled=true;
    const {error}=await sb.from("tasks").insert({title:d.points[i],tag:TASK_TAG[d.tag]||"personal",source:"braindump"});
    if(error){b.disabled=false;return fail(error)}
    await update(d,{sent:[...new Set([...(d.sent||[]),i])]}); toast("Added to your tasks on Home");
  }
  if(act==="done") update(d,{status:d.status==="done"?"open":"done"});
  if(act==="raw"){openRaw.has(d.id)?openRaw.delete(d.id):openRaw.add(d.id);render()}
  if(act==="copy"){const txt=[d.title,...(d.points||[])].join("\n");try{await navigator.clipboard.writeText(txt);toast("Copied")}catch(_){toast("Couldn't copy on this device")}}
  if(act==="edit"){editing=d.id;render()}
  if(act==="edcancel"){editing=null;render()}
  if(act==="edsave"){
    const pts=$("#edPts").value.split("\n").map(s=>s.trim()).filter(Boolean); if(!pts.length) return toast("Add at least one point");
    const title=$("#edTitle").value.trim()||titleFrom(pts); editing=null;
    update(d,{title,points:pts,tidied:true,sent:[]});
  }
  if(act==="del"){
    dumps=dumps.filter(x=>x.id!==d.id); render();
    const {error}=await sb.from("brain_dumps").delete().eq("id",d.id);
    if(error) return fail(error);
    const {id,...rest}=d;
    toast("Dump deleted","Undo",async()=>{const {data,error}=await sb.from("brain_dumps").insert({id,...rest}).select().single(); if(error) return fail(error); merge(data); render();});
  }
});
$("#saveBtn").addEventListener("click",saveDump);
$("#dumpIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();saveDump()}});
$("#capTag").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;capTag=b.dataset.t;$("#capTag").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
$("#filt").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;$("#filt").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});

async function load(){
  const {data,error}=await sb.from("brain_dumps").select("*").order("created_at",{ascending:false}).limit(300);
  if(error){$("#list").innerHTML=`<div class="empty">Couldn't load dumps. Refresh to try again.</div>`;return}
  dumps=data||[]; if(!editing) render();
}
revRequireLogin(()=>{load();
  sb.channel("dumps-live").on("postgres_changes",{event:"*",schema:"public",table:"brain_dumps"},p=>{
    if(editing) return;
    if(p.eventType==="DELETE") dumps=dumps.filter(d=>d.id!==p.old.id); else merge(p.new);
    render();
  }).subscribe();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
});
})();
</script>
</body>
</html>
